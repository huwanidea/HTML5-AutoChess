            setTooltipIcon(heroId, fallbackIcon, starLevel = 1) {
                const iconEl = document.getElementById('tooltipIcon');
                const drawn = this.applyHeroSpriteFirstFrame(iconEl, heroId, fallbackIcon || '❓');
                if (!drawn) {
                    iconEl.textContent = fallbackIcon || '❓';
                }
            }

            positionTooltip(tooltip, e) {
                const gap = 15;
                const margin = 12;

                tooltip.style.visibility = 'hidden';
                tooltip.classList.add('active');
                tooltip.style.left = '0px';
                tooltip.style.top = '0px';

                const rect = tooltip.getBoundingClientRect();
                let left = e.clientX + gap;
                let top = e.clientY + gap;

                if (left + rect.width + margin > window.innerWidth) {
                    left = e.clientX - rect.width - gap;
                }
                if (left < margin) {
                    left = margin;
                }

                if (top + rect.height + margin > window.innerHeight) {
                    top = e.clientY - rect.height - gap;
                }
                if (top < margin) {
                    top = Math.max(margin, window.innerHeight - rect.height - margin);
                }

                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
                tooltip.style.visibility = 'visible';
            }

            showTooltip(e, hero) {
                this.showUnitTooltip(e, this.createPreviewUnit(hero, 1));
            }

            showShopTooltip(e, hero) { this.showTooltip(e, hero); }

            showSynergyTooltip(e, synergyKey) {
                const tooltip = document.getElementById('tooltip');
                if (this._tooltipMode === 'synergy' && this._tooltipKey === synergyKey) {
                    this.hideTooltip();
                    return;
                }

                const synergy = SYNERGIES[synergyKey];
                if (!synergy) return;

                this._tooltipMode = 'synergy';
                this._tooltipKey = synergyKey;
                tooltip.classList.add('synergy-tooltip');
                tooltip.onmouseleave = () => {
                    if (this._tooltipMode === 'synergy') this.hideTooltip();
                };

                const boardUnits = this.getBoardUnits();
                const activeCount = new Set(
                    boardUnits
                        .filter(unit => unit && unit.synergy && unit.synergy.includes(synergyKey))
                        .map(unit => unit.heroId)
                ).size;
                const heroes = Object.values(HEROES).filter(hero => hero.synergy && hero.synergy.includes(synergyKey));
                const heroChips = heroes.map(hero => {
                    const iconStyle = this.getHeroSpriteFirstFrameStyle(hero.id);
                    const iconContent = iconStyle ? '' : hero.icon;
                    return `
                        <div class="tooltip-hero-chip" data-hero-id="${hero.id}">
                            <span class="tooltip-hero-chip-icon" style="${iconStyle}">${iconContent}</span>
                            <span class="tooltip-hero-chip-name">${hero.name}</span>
                        </div>
                    `;
                }).join('');

                const nextTier = synergy.tiers.find(tier => activeCount < tier) || synergy.tiers[synergy.tiers.length - 1];
                document.getElementById('tooltipIcon').innerHTML = synergy.asset
                    ? `<img class="synergy-icon-img" src="${synergy.asset}?v=${PNG_ASSET_VERSION}" alt="${synergy.name}">`
                    : synergy.icon;
                document.getElementById('tooltipName').textContent = synergy.name;
                document.getElementById('tooltipStars').textContent = `\u5df2\u4e0a\u9635 ${activeCount}/${nextTier}`;
                document.getElementById('tooltipCost').textContent = '';
                document.getElementById('tooltipStats').innerHTML = `
                    <div class="synergy-tooltip-summary">
                        <div>\u89e6\u53d1\u6863\u4f4d\uff1a${synergy.tiers.join(' / ')}</div>
                        <div>\u6548\u679c\uff1a${synergy.effects.join(' \u2192 ')}</div>
                    </div>
                    <div style="color:#ffd76a;margin-bottom:4px;">\u5305\u542b\u82f1\u96c4</div>
                    <div class="synergy-tooltip-heroes">${heroChips}</div>
                `;
                document.getElementById('tooltipSynergies').innerHTML = '';

                tooltip.querySelectorAll('.tooltip-hero-chip').forEach(chip => {
                    chip.addEventListener('mouseenter', (event) => {
                        const hero = HEROES[chip.dataset.heroId];
                        if (hero) this.showUnitTooltip(event, this.createPreviewUnit(hero, 1));
                    });
                });

                this.positionTooltip(tooltip, e);
            }

            showUnitTooltip(e, unit) {

                document.getElementById('tooltipCost').innerHTML = `<span class="coin-icon"></span>${unit.cost}`;

                `;
                document.getElementById('tooltipSynergies').innerHTML = `

                `;
                this.positionTooltip(tooltip, e);

            hideTooltip() {

                tooltip.onmouseleave = null;

            addLog(message, type = 'normal') {

                entry.className = `log-entry log-${type}`;
                entry.innerHTML = `<span class="log-round-tag">R${this.round}</span><span class="log-msg">${message}</span>`;
                list.insertBefore(entry, list.firstChild);

            toggleLogPanel() {

                if (!list || !btn) return;

                list.classList.toggle('log-list-compact', !this.logOpen);

                this.combatSpeed = speed === 2 ? 2 : 1;

                const btnTop = document.getElementById('speedBtnTop');
                if (btnTop) {
                    btnTop.textContent = speedText;
                    btnTop.classList.toggle('active', this.combatSpeed === 2);

            toggleSpeed() {
                this.setCombatSpeed(this.combatSpeed === 1 ? 2 : 1);

            showSettings() {
                this.updateSettingsPanel();
                document.getElementById('settingsOverlay').classList.add('active');

            hideSettings() {

            updateSettingsPanel() {
                const muted = SFX.isMuted();
                const sfxTop = document.getElementById('sfxToggleBtn');
                if (sfxTop) {
                    sfxTop.classList.toggle('muted', muted);
                    sfxTop.title = muted ? '音效已关闭' : '音效已开启';
                }
                const sfxBtn = document.getElementById('settingsSfxBtn');
                if (sfxBtn) {
                    sfxBtn.textContent = muted ? '关闭' : '开启';

                }
                const speed1 = document.getElementById('settingsSpeed1');
                const speed2 = document.getElementById('settingsSpeed2');
                if (speed1) speed1.classList.toggle('active', this.combatSpeed === 1);
                if (speed2) speed2.classList.toggle('active', this.combatSpeed === 2);
                document.querySelectorAll('[data-settings-diff]').forEach(btn => {

                    rangeBtn.textContent = this.showRangeHints ? '开启' : '关闭';
                    rangeBtn.classList.toggle('active', this.showRangeHints);
                }
                const logBtn = document.getElementById('settingsLogBtn');
                if (logBtn) {
                    logBtn.textContent = this.logOpen ? '显示' : '隐藏';
                    logBtn.classList.toggle('active', this.logOpen);
                }

            updateCounterRelationPanel() {
                const panel = document.getElementById('counterRelationPanel');
                if (!panel) return;

                const history = this.roundHistory || [];
                const isWin = (record) => String(record.result || '').includes('\u80dc');
                const recent = history.slice(0, 5);
                const latest = recent[0];
                const streakType = this.winStreak > 0 ? '\u8fde\u80dc' : this.loseStreak > 0 ? '\u8fde\u8d25' : '\u65e0\u8fde\u7eed';
                const streakCount = this.winStreak > 0 ? this.winStreak : this.loseStreak > 0 ? this.loseStreak : 0;
                const body = latest
                    ? `
                        <div class="battle-result-line">
                            R${latest.round} <span class="${isWin(latest) ? 'counter-relation-good' : 'counter-relation-risk'}">${latest.result}</span>
                            <span style="color:#8f7a4d;">${streakCount > 0 ? ` · ${streakType}${streakCount}` : ''}</span>
                        </div>
                        <div class="battle-history-mini">
                            ${recent.map(record => `<span class="result-dot ${isWin(record) ? 'win' : 'lose'}" title="${(record.detail || '').replace(/"/g, '&quot;')}">${isWin(record) ? '\u80dc' : '\u8d25'}</span>`).join('')}
                        </div>
                    `
                    : `
                        <div class="battle-result-line">\u6682\u65e0\u6218\u7ee9</div>
                        <div style="color:#8f7a4d;">\u5b8c\u6210\u4e00\u573a\u6218\u6597\u540e\u663e\u793a</div>
                    `;
                panel.innerHTML = `
                    <div class="counter-relation-title">本局战绩</div>
                    <div class="counter-relation-body">${body}</div>
                `;
            }

            updateUI() {
                document.getElementById('goldDisplay').textContent = this.gold;
                document.getElementById('hpDisplay').textContent = this.hp;
                document.getElementById('roundDisplay').textContent = this.round;
                document.getElementById('levelBadge').textContent = this.playerLevel;

                const expNeeded = CONFIG.EXP_PER_LEVEL[this.playerLevel - 1] || 4;
                const expFill = document.getElementById('expFill');
                const expText = document.getElementById('expText');
                const isMaxLevel = this.playerLevel >= CONFIG.MAX_LEVEL;
                const expPct = isMaxLevel ? 100 : Math.max(0, Math.min(100, (this.exp / expNeeded) * 100));
                expFill.style.width = expPct + '%';
                expFill.classList.toggle('empty', !isMaxLevel && this.exp <= 0);
                if (expText) expText.textContent = isMaxLevel ? 'MAX' : `${this.exp}/${expNeeded}`;

                document.getElementById('refreshBtn').disabled = this.gold < CONFIG.REFRESH_COST || !this.canManageEconomy();
                document.getElementById('buyExpBtn').disabled = this.gold < CONFIG.EXP_COST || this.playerLevel >= CONFIG.MAX_LEVEL || !this.canManageEconomy();
                document.getElementById('skipPrepBtn').disabled = this.phase !== 'preparation';
                document.getElementById('skipPrepBtn').classList.toggle('active', this.skippedPrep);

                // 难度按钮（仅备战阶段可切换）
                const diffBtns = ['diffEasy', 'diffNormal', 'diffHard'];
                diffBtns.forEach(id => document.getElementById(id).disabled = this.phase !== 'preparation');

                this.updateBoardUnitCount();
                this.updateCounterRelationPanel();
            }

            // ========== AI系统 ==========
            initAIPlayers() {
                this.aiPlayers = [];
                for (let i = 0; i < CONFIG.TOTAL_PLAYERS - 1; i++) {
                    this.aiPlayers.push({
                        id: i,
                        hp: CONFIG.INITIAL_HP,
                        gold: CONFIG.INITIAL_GOLD,
                        level: 1,
                        bench: [],
                        board: Array(CONFIG.BOARD_HEIGHT).fill(null).map(() => Array(CONFIG.BOARD_WIDTH).fill(null)),
                        alive: true,
                        boardUnits: 0
                    });
                }
                this.updateAIPreview();
            }

            // 每回合开始时模拟AI行为（购买、升级、布阵）
            simulateAIActions() {
                const diff = AI_DIFFICULTY[this.aiDifficulty] || AI_DIFFICULTY.normal;
                for (const ai of this.aiPlayers) {
                    if (!ai.alive) continue;
                    ai.gold += diff.income;
                    // 购买棋子
                    const buys = diff.buysPerRound;
                    for (let b = 0; b < buys; b++) {
                        if (ai.gold < 1) break;
                        const hero = this.drawShopHeroForAI(ai.level + diff.levelBonus);
                        const unit = new Unit(hero, 1, false);
                        // 困难模式额外加成星级
                        if (diff.starBonus > 0 && Math.random() < 0.3) unit.starLevel = 2;
                        if (diff.bonusAtk) unit.baseAtk += diff.bonusAtk;
                        if (diff.bonusHp) unit.baseHp += diff.bonusHp;
                        unit.recalculateStats();
                        ai.bench.push(unit);
                        ai.gold -= 1;
                    }
                    // 升级
                    if (ai.gold >= CONFIG.EXP_COST && ai.level < CONFIG.MAX_LEVEL && Math.random() < diff.upgradeChance) {
                        ai.gold -= CONFIG.EXP_COST;
                        ai.level++;
                    }
                    this.placeAIUnits(ai);
                }
            }

            // 为AI抽卡（根据AI等级的概率）
            drawShopHeroForAI(aiLevel) {
                const prob = CONFIG.SHOP_PROB[aiLevel] || [100, 0, 0, 0, 0];
                const roll = Math.random() * 100;
                let cost = 1, cumulative = 0;
                for (let c = 0; c < prob.length; c++) {
                    cumulative += prob[c];
                    if (roll < cumulative) { cost = c + 1; break; }
                }
                const pool = Object.values(HEROES).filter(h => h.tier === cost);
                return pool[Math.floor(Math.random() * pool.length)];
            }

            // AI自动布阵：前排放守御单位，后排放输出单位，镜像玩家站位
            placeAIUnits(ai, mirrorPlayer = true) {
                // 清空棋盘
                for (let r = 0; r < CONFIG.BOARD_HEIGHT; r++)
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++)
                        ai.board[r][c] = null;

                // 从仓库取出待布阵的棋子
                const toPlace = [...ai.bench];
                ai.bench = [];

                let mirroredCount = 0;
                // 如果启用镜像模式，读取玩家的站位并反向复制到敌方区
                if (mirrorPlayer) {
                    const playerRows = [];
                    for (let r = CONFIG.PLAYER_ZONE_START; r < CONFIG.BOARD_HEIGHT; r++) {
                        playerRows.push(r);
                    }

                    let slotIdx = 0;
                    for (const playerRow of playerRows) {
                        if (slotIdx >= toPlace.length) break;
                        const enemyRow = CONFIG.PLAYER_ZONE_START - 1 - (playerRow - CONFIG.PLAYER_ZONE_START);
                        if (enemyRow < 0) continue;

                        const rowSlots = [];
                        for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                            const u = this.playerBoard[playerRow][c];
                            if (u) rowSlots.push({ col: c });
                        }

                        for (const slot of rowSlots) {
                            if (slotIdx >= toPlace.length) break;
                            const mirrorCol = (CONFIG.BOARD_WIDTH - 1) - slot.col;
                            if (!ai.board[enemyRow][mirrorCol]) {
                                ai.board[enemyRow][mirrorCol] = toPlace[slotIdx];
                                toPlace[slotIdx].boardRow = enemyRow;
                                toPlace[slotIdx].boardCol = mirrorCol;
                                mirroredCount++;
                                slotIdx++;
                            }
                        }
                    }
                }

                // 剩余未布阵的棋子按默认规则填充（前排坦克，后排输出）
                const front = [], back = [];
                for (const u of toPlace) {
                    const isPlaced = Object.values(ai.board).flat().includes(u);
                    if (isPlaced) continue;
                    if ((u.range || 1) <= 1 || u.maxHp >= 300 || u.synergy.includes('datang')) {
                        front.push(u);
                    } else {
                        back.push(u);
                    }
                }
                const order = [...front, ...back];

                let placed = Object.values(ai.board).flat().filter(Boolean).length;
                const enemyRows = Array.from({ length: CONFIG.PLAYER_ZONE_START }, (_, i) => CONFIG.PLAYER_ZONE_START - 1 - i);
                let fallbackIdx = 0;
                for (const unit of order) {
                    if (placed >= ai.level) break;

                    let placedThisUnit = false;
                    for (let i = 0; i < enemyRows.length && !placedThisUnit; i++) {
                        const row = enemyRows[i];
                        for (let c = 0; c < CONFIG.BOARD_WIDTH && !placedThisUnit; c++) {
                            const col = (fallbackIdx + c) % CONFIG.BOARD_WIDTH;
                            if (!ai.board[row][col]) {
                                ai.board[row][col] = unit;
                                unit.boardRow = row;
                                unit.boardCol = col;
                                placedThisUnit = true;
                            }
                        }
                    }

                    if (placedThisUnit) {
                        placed++;
                        fallbackIdx = (fallbackIdx + 1) % CONFIG.BOARD_WIDTH;
                    }
                }
                for (const u of order) {
                    if (!Object.values(ai.board).flat().includes(u)) {
                        ai.bench.push(u);
                    }
                }
                ai.boardUnits = Object.values(ai.board).flat().filter(Boolean).length;
            }

            // 淘汰死亡的AI
            eliminateDeadAIs() {
                for (const ai of this.aiPlayers) {
                    if (ai.alive && ai.hp <= 0) {
                        ai.alive = false;
                        this.addLog(`🤖 AI玩家${ai.id + 1} 被淘汰`, 'combat');
                    }
                }
            }

            updateAIPreview() {
                const alive = this.aiPlayers.filter(a => a.alive);
                const info = document.getElementById('enemyPreviewInfo');
                if (alive.length === 0) {
                    info.textContent = '无对手（你已获胜!）';
                    return;
                }
                // 显示存活AI数量和玩家血量对比
                info.textContent = `AI存活: ${alive.length}/7 | 你的HP: ${this.hp}`;
            }

            spawnEnemies() {
                this.enemies = [];
                this.enemyPositions = [];
                // 从存活的AI中优先选择排名靠前（阵容强）的作为对手
                const aliveAIs = this.aiPlayers.filter(a => a.alive);
                if (aliveAIs.length === 0) {
                    this.addLog('⚔️ 无对手，胜利!', 'combat');
                    return;
                }
                // 随机从最强的前3名中选（模拟"排位相近的人更可能对战"）
                const sorted = [...aliveAIs].sort((a, b) => b.boardUnits - a.boardUnits || b.level - a.level);
                const pool = sorted.slice(0, Math.min(3, sorted.length));
                this.currentOpponent = pool[Math.floor(Math.random() * pool.length)];

                // 从对手AI的棋盘上取出存活的敌人
                for (let r = 0; r < CONFIG.PLAYER_ZONE_START; r++) {
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                        const enemy = this.currentOpponent.board[r][c];
                        if (enemy) {
                            this.resetCombatState(enemy, true);
                            enemy.game = this;
                            enemy.boardRow = r;
                            enemy.boardCol = c;
                            this.enemies.push(enemy);
                            this.enemyPositions.push({ row: r, col: c });
                        }
                    }
                }
                // 如果AI棋盘为空（早期回合），生成预设阵容
                if (this.enemies.length === 0) {
                    const earlyBonus = this.round <= 3 ? 1 : 0;
                    const count = Math.min(2 + Math.floor(this.round / 2) + earlyBonus, 8);
                    for (let i = 0; i < count; i++) {
                        const hero = this.drawShopHeroForAI(this.currentOpponent.level);
                        const star = Math.min(3, 1 + Math.floor(this.round / 4));
                        const enemy = new Unit(hero, star, false);
                        enemy.game = this;
                        const row = i % CONFIG.PLAYER_ZONE_START;
                        const col = CONFIG.BOARD_WIDTH - 1 - Math.floor(i / CONFIG.PLAYER_ZONE_START);
                        enemy.boardRow = row;
                        enemy.boardCol = col;
                        this.enemies.push(enemy);
                        this.enemyPositions.push({ row, col });
                    }
                }

                this.addLog(`👹 对手: AI#${this.currentOpponent.id + 1} | ${this.enemies.length}个棋子`, 'combat');
            }

            updateEnemyPreview() {
                const alive = this.enemies.filter(e => !e.isDead).length;
                const total = this.enemies.length;
                document.getElementById('enemyPreviewInfo').textContent = `${alive}/${total} 存活 | 回合${this.round}`;
            }

            getDistance(a, b) {
                return Math.abs(a.boardRow - b.boardRow) + Math.abs(a.boardCol - b.boardCol);
            }

            _findTargetById(targets, id) {
                if (!id || !targets || targets.length === 0) return null;
                return targets.find(t => t && !t.isDead && t.id === id) || null;
            }

            findNearestTarget(unit, targets) {
                if (!targets || targets.length === 0) return null;
                let best = null;
                let bestDist = Infinity;
                for (const t of targets) {
                    const d = this.getDistance(unit, t);
                    if (d < bestDist || (d === bestDist && t.hp < (best?.hp ?? Infinity))) {
                        bestDist = d;
                        best = t;
                    }
                }
                return best;
            }

            pickTarget(unit, targets) {
                if (!unit || !targets || targets.length === 0) return null;
                const dt = this._combatStepDt || 1;

                if (unit.targetSwitchCooldown > 0) {
                    unit.targetSwitchCooldown -= dt;
                }
                if (unit.targetLockTicks > 0) {
                    unit.targetLockTicks -= dt;
                }
                if (unit.lastAttackerLockTicks > 0) {
                    unit.lastAttackerLockTicks -= dt;
                }

                const revengeTarget = this._findTargetById(targets, unit.lastAttackerId);
                if (revengeTarget && unit.lastAttackerLockTicks > 0) {
                    unit.lockedTargetId = revengeTarget.id;
                    unit.targetLockTicks = Math.max(unit.targetLockTicks, 8);
                    unit.targetSwitchCooldown = Math.max(unit.targetSwitchCooldown, 6);
                    return revengeTarget;
                }

                const current = this._findTargetById(targets, unit.lockedTargetId);
                if (current && unit.targetLockTicks > 0) {
                    return current;
                }

                if (current && unit.targetSwitchCooldown > 0) {
                    unit.targetLockTicks = Math.max(unit.targetLockTicks, 6);
                    return current;
                }

                const next = this.findNearestTarget(unit, targets);
                if (!next) {
                    unit.lockedTargetId = null;
                    return null;
                }

                if (!current || current.id !== next.id) {
                    unit.lockedTargetId = next.id;
                    unit.targetLockTicks = 12;
                    unit.targetSwitchCooldown = 8;
                }

                return next;
            }

            performAssassinJumpIfNeeded(unit, targets, playerUnits, enemyUnits) {
                if (!unit || unit.isDead || unit.hasAssassinJumped) return;
                if (!unit.synergy.includes('assassin')) return;
                if (!targets || targets.length === 0) return;

                const backline = [...targets].sort((a, b) => {
                    if (unit.isPlayer) {
                        return a.boardRow - b.boardRow;
                    }
                    return b.boardRow - a.boardRow;
                });
                const priority = backline[0];
                if (!priority) return;

                const candidates = [
                    { r: priority.boardRow, c: priority.boardCol - 1 },
                    { r: priority.boardRow, c: priority.boardCol + 1 },
                    { r: priority.boardRow - 1, c: priority.boardCol },
                    { r: priority.boardRow + 1, c: priority.boardCol }
                ];

                let jumpCell = null;
                for (const p of candidates) {
                    if (p.r < 0 || p.r >= CONFIG.BOARD_HEIGHT || p.c < 0 || p.c >= CONFIG.BOARD_WIDTH) continue;
                    if (this.isCellBlockedByAny(p.r, p.c, playerUnits, enemyUnits)) continue;
                    jumpCell = p;
                    break;
                }
                if (!jumpCell) return;

                if (unit.isPlayer) {
                    this.playerBoard[unit.boardRow][unit.boardCol] = null;
                    this.playerBoard[jumpCell.r][jumpCell.c] = unit;
                }

                unit.boardRow = jumpCell.r;
                unit.boardCol = jumpCell.c;
                unit.moveCooldown = 8;
                unit.hasAssassinJumped = true;
                unit.lockedTargetId = priority.id;
                unit.targetLockTicks = 15;
                this.addLog(`🗡️ ${unit.name} 切入后排`, 'combat');
            }

            isCellBlockedByFriendly(unit, row, col, playerUnits, enemyUnits) {
                const allies = unit.isPlayer ? playerUnits : enemyUnits;
                return allies.some(u => !u.isDead && u !== unit && u.boardRow === row && u.boardCol === col);
            }

            isCellBlockedByAny(row, col, playerUnits, enemyUnits) {
                return [...playerUnits, ...enemyUnits].some(u => !u.isDead && u.boardRow === row && u.boardCol === col);
            }

            stepTowardTarget(unit, target, playerUnits, enemyUnits) {
                if (!unit || !target) return;
                const dt = this._combatStepDt || 1;
                if (unit.moveCooldown > 0) {
                    unit.moveCooldown -= dt;
                    return;
                }

                const dirs = [
                    { dr: -1, dc: 0 },
                    { dr: 1, dc: 0 },
                    { dr: 0, dc: -1 },
                    { dr: 0, dc: 1 }
                ];

                const currentDist = this.getDistance(unit, target);
                let bestMove = null;
                let bestDist = currentDist;

                for (const { dr, dc } of dirs) {
                    const nr = unit.boardRow + dr;
                    const nc = unit.boardCol + dc;
                    if (nr < 0 || nr >= CONFIG.BOARD_HEIGHT || nc < 0 || nc >= CONFIG.BOARD_WIDTH) continue;
                    if (this.isCellBlockedByFriendly(unit, nr, nc, playerUnits, enemyUnits)) continue;
                    const occupied = this.isCellBlockedByAny(nr, nc, playerUnits, enemyUnits);
                    if (occupied) continue;

                    const d = Math.abs(nr - target.boardRow) + Math.abs(nc - target.boardCol);
                    if (d < bestDist) {
                        bestDist = d;
                        bestMove = { row: nr, col: nc };
                    }
                }

                if (!bestMove) return;

                if (unit.isPlayer) {
                    this.playerBoard[unit.boardRow][unit.boardCol] = null;
                    this.playerBoard[bestMove.row][bestMove.col] = unit;
                }

                const fromRow = unit.boardRow;
                const fromCol = unit.boardCol;
                unit.boardRow = bestMove.row;
                unit.boardCol = bestMove.col;
                // 触发走路动画 + 面向更新
                unit.triggerWalk(fromRow, fromCol, bestMove.row, bestMove.col, CONFIG.CELL_SIZE, unit.isPlayer);
                const earlyRoundMeleeBoost = this.round <= 3 && (unit.range || 1) <= 1 ? 1 : 0;
                unit.moveCooldown = Math.max(4, 6 - earlyRoundMeleeBoost); // 大图前期近战更快接敌
            }

            isDeathAnimationPending() {
                return [...this.getBoardUnits(), ...this.enemies].some(unit =>
                    unit && unit.isDead && (unit.deathTicks || 0) < CONFIG.DEATH_ANIM_TICKS
                );
            }

            combatTick() {
                if (this.phase !== 'combat') return;
                const dt = 1;
                this._combatStepDt = dt;
                // 所有存活单位先tick（冷却、回复等） + 动画更新
                for (const unit of [...this.enemies, ...this.getBoardUnits()]) {
                    if (!unit) continue;
                    unit.tickAnim(dt);
                    if (unit.isDead) continue;
                    unit.tick(dt);
                    if (unit.healFlash > 0) {
                        SFX.heal();
                        const p = this.getCellCenter(unit.boardRow, unit.boardCol);
                        this.addFloatDamage(
                            p.x,
                            p.y,
                            Math.floor(unit.healFlash), 'heal'
                        );
                        unit.clearHealFlash();
                    }
                }

                // 当前存活（tick后）
                let playerUnits = this.getBoardUnits().filter(u => !u.isDead);
                let aliveEnemies = this.enemies.filter(e => !e.isDead);

                // 任一方已全灭则直接结束
                if (playerUnits.length === 0 || aliveEnemies.length === 0) {
                    if (this.isDeathAnimationPending()) {
                        this.updateEnemyPreview();
                        this.render();
                        return;
                    }
                    this.endCombat();
                    return;
                }

                // 攻击+走位阶段（仇恨锁定/突进后排/远程最小射程）
                for (const unit of [...playerUnits, ...aliveEnemies]) {
                    if (!unit || unit.isDead) continue;
                    const targets = unit.isPlayer ? aliveEnemies : playerUnits;

                    this.performAssassinJumpIfNeeded(unit, targets, playerUnits, aliveEnemies);

                    const target = this.pickTarget(unit, targets);
                    if (!target || target.isDead) continue;

                    const dist = this.getDistance(unit, target);
                    const maxRange = unit.range || 1;
                    const minRange = Math.min(unit.minRange || 1, maxRange);
                    const inRange = dist <= maxRange;
                    const tooClose = dist < minRange;

                    if (inRange && !tooClose && unit.canAttack()) {
                        unit.holdPositionTicks = 8;
                        target.triggerHit();
                        const result = unit.performAttack(target);
                        if (result.cast) unit.triggerSkill(target);
                        else unit.triggerAttack(target);
                        if (unit.isPlayer) { this.totalDamageDealt += result.damage; SFX.attack(); }

                        const targetPos = this.getCellCenter(target.boardRow, target.boardCol);
                        const unitPos = this.getCellCenter(unit.boardRow, unit.boardCol);
                        const tx = targetPos.x;
                        const ty = targetPos.y;
                        let dmgType = result.crit ? 'crit' : 'damage';
                        if (unit.trueDamageRate > 0) dmgType = 'true';
                        this.addFloatDamage(tx, ty, Math.floor(result.damage), dmgType);
                        const sx = unitPos.x;
                        const sy = unitPos.y;
                        this.attackAnims.push({ sx, sy, tx, ty, startTime: Date.now(), duration: 280, crit: result.crit, fromPlayer: unit.isPlayer, heroId: unit.heroId });
                        if (result.cast) {
                            this.attackAnims.push({ sx, sy, tx: sx, ty: sy, startTime: Date.now(), duration: 420, crit: true, cast: true, fromPlayer: unit.isPlayer, heroId: unit.heroId });
                            this.addFloatDamage(sx, sy - 10, unit.skillName || '技能释放', 'castName');
                        }
                        if (result.skillLog) this.addLog(result.skillLog, 'skill');

                        if (unit.isPlayer) {
                            this.addLog(`${unit.name} → ${target.name}: ${Math.floor(result.damage)}${result.crit ? ' ⚡' : ''}`, 'damage');
                        }
                    } else if (tooClose && maxRange > 1) {
                        // 远程太近时优先站桩，避免抖动横跳
                        if (unit.holdPositionTicks > 0) {
                            unit.holdPositionTicks -= dt;
                        } else {
                            this.stepTowardTarget(unit, target, playerUnits, aliveEnemies);
                        }
                    } else if (!inRange) {
                        this.stepTowardTarget(unit, target, playerUnits, aliveEnemies);
                    }
                }

                // 攻击循环结束后检查：任一方全灭则结束
                const finalPlayerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const finalEnemies = this.enemies.filter(e => !e.isDead);
                if (finalPlayerUnits.length === 0 || finalEnemies.length === 0) {
                    if (this.isDeathAnimationPending()) {
                        this.updateEnemyPreview();
                        this.render();
                        return;
                    }
                    this.endCombat();
                    return;
                }

                this.applyCombatOvertimeRage(dt);
                this.updateEnemyPreview();
                this.renderEnemySynergyPreview();
                document.getElementById('phaseTimerDisplay').textContent = this.combatOvertime ? '∞' : Math.ceil(this.combatTicks / 10);
                this.render();
            }

            enterCombatOvertime() {
                if (this.phase !== 'combat' || this.combatOvertime) return false;
                const playerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const aliveEnemies = this.enemies.filter(e => !e.isDead);
                if (playerUnits.length === 0 || aliveEnemies.length === 0) return false;

                this.combatOvertime = true;
                this.combatRageStacks = 0;
                this.combatRageTickCounter = 0;
                this.combatTicks = 0;
                this.addLog('⏱️ 战斗进入加时，直到一方全灭', 'combat');
                this._showPhaseBar('combat', '⚔️', '战斗加时', 0);
                return true;
            }

            applyCombatOvertimeRage(dt = 1) {
                if (!this.combatOvertime) return;
                this.combatRageTickCounter += dt;
                while (this.combatRageTickCounter >= CONFIG.COMBAT_OVERTIME_RAGE_INTERVAL_TICKS) {
                    this.combatRageTickCounter -= CONFIG.COMBAT_OVERTIME_RAGE_INTERVAL_TICKS;
                    this.combatRageStacks++;
                    for (const unit of [...this.getBoardUnits(), ...this.enemies]) {
                        if (!unit || unit.isDead) continue;
                        unit.atk = Math.max(1, Math.floor(unit.atk * 1.12));
                        unit.atkSpeed *= 1.12;
                    }
                    this.addLog(`🔥 战斗加时狂暴 +${this.combatRageStacks * 12}% 攻击/攻速`, 'combat');
                }
            }

            _updateElo(actualScore) {
                if (this.round <= 3) return; // 野怪回合不计入
                this.eloMatchCount++;
                const K = this.eloMatchCount < 15 ? 32 : 16;
                const expectedScore = 1 / (1 + Math.pow(10, ((this.currentAiElo || 1200) - this.eloRating) / 400));
                const eloDelta = Math.round(K * (actualScore - expectedScore));
                this.eloRating += eloDelta;
                this.updateTopBar();
            }

            endCombat() {
                if (this.phase !== 'combat') return;
                this.phase = 'resolving';
                const playerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const aliveEnemies = this.enemies.filter(e => !e.isDead);
                const isWin = playerUnits.length > 0 && aliveEnemies.length === 0;

                if (isWin) {
                    this.winStreak++;
                    this.loseStreak = 0;
                    this.pushRoundHistory('胜利', `对手: AI#${this.currentOpponent ? this.currentOpponent.id + 1 : '-'} 残敌:${aliveEnemies.length}`);
                    // 胜利奖励
                    let totalReward = CONFIG.WIN_REWARD;
                    // 连胜奖励
                    for (let i = 0; i < CONFIG.STREAK_THRESHOLDS.length; i++) {
                        if (this.winStreak >= CONFIG.STREAK_THRESHOLDS[i]) {
                            totalReward += CONFIG.STREAK_REWARDS[i];
                        }
                    }
                    this.gold += totalReward;
                    this.addLog(`🏆 战斗胜利! +${totalReward}金 (胜利+${CONFIG.WIN_REWARD}${this.winStreak >= 3 ? ', 连胜+' + (totalReward - CONFIG.WIN_REWARD) : ''})`, 'round');
                } else {
                    this.loseStreak++;
                    this.winStreak = 0;
                    this.pushRoundHistory('失败', `对手: AI#${this.currentOpponent ? this.currentOpponent.id + 1 : '-'} 残敌:${aliveEnemies.length}`);
                    // 连败补偿（奖励独立计算，不扣钱）
                    let loseComp = 0;
                    for (let i = 0; i < CONFIG.STREAK_THRESHOLDS.length; i++) {
                        if (this.loseStreak >= CONFIG.STREAK_THRESHOLDS[i]) {
                            loseComp += CONFIG.STREAK_REWARDS[i];
                        }
                    }
                    const damage = aliveEnemies.length > 0 ? Math.max(1, aliveEnemies.length * 2 - this.playerLevel) : 0;
                    this.hp -= damage;
                    this.addLog(`💔 战斗失败! -${damage}HP${loseComp > 0 ? ` (连败补偿+${loseComp}金将在下回合发放)` : ''}`, 'damage');
                    // 存储连败补偿（下一回合发放）
                    if (loseComp > 0) this.pendingLoseComp = loseComp;
                }

                this.updateStreakDisplay();

                this.resetUnitsAfterBattle();
                
                // AI扣血和淘汰
                if (this.currentOpponent && this.currentOpponent.alive) {
                    if (!isWin) {
                        // 玩家失败：AI扣血
                        const aiDamage = this.getBoardUnitsCount();
                        this.currentOpponent.hp -= Math.max(1, aiDamage - Math.floor(this.currentOpponent.level / 2));
                        this.addLog(`🤖 AI#${this.currentOpponent.id + 1} -${Math.max(1, aiDamage)}HP`, 'combat');
                    } else {
                        // 玩家胜利：随机另一个存活的AI扣血（对手伤害分流）
                        const others = this.aiPlayers.filter(a => a.alive && a.id !== this.currentOpponent.id);
                        if (others.length > 0) {
                            const victim = others[Math.floor(Math.random() * others.length)];
                            const dmg = Math.max(1, this.getBoardUnitsCount() - Math.floor(victim.level / 2));
                            victim.hp -= dmg;
                            this.addLog(`🤖 AI#${victim.id + 1} 受到溅射 -${dmg}HP`, 'combat');
                        }
                    }
                }
                this.eliminateDeadAIs();
                this.updateAIPreview();

                this.round++;
                this.enemies = [];
                this.enemyPositions = [];
                this.renderBench();
                this.updateUI();
                this._hidePhaseBar();
                document.getElementById('enemyPreviewInfo').textContent = '等待战斗...';
                document.getElementById('enemySynergyPreview').style.display = 'none';

                // 胜利条件：所有AI被淘汰
                const aliveAIs = this.aiPlayers.filter(a => a.alive);
                if (this.hp <= 0) {
                    this.gameOver = true;
                    this.showOverlay(false, aliveAIs.length);
                } else if (aliveAIs.length === 0) {
                    this.gameOver = true;
                    this.showOverlay(true, 0);
                } else {
                    this.startPreparationPhase();
                }
            }

            showOverlay(isVictory, aliveAIs = 0) {
                const title = document.getElementById('overlayTitle');
                title.textContent = isVictory ? '🏆 胜利!' : '游戏结束';
                title.className = `overlay-title ${isVictory ? 'victory' : 'defeat'}`;
                document.getElementById('overlayStats').textContent = `存活回合: ${this.round}`;
                document.getElementById('overlayDetail').innerHTML = `
                    最终等级: ${this.playerLevel}<br>
                    卖出单位: ${this.totalUnitsSold}<br>
                    淘汰AI: ${CONFIG.TOTAL_PLAYERS - 1 - aliveAIs}/7<br>
                    ${this.winStreak > 0 ? `最高连胜: ${this.winStreak}` : `最高连败: ${this.loseStreak}`}
                `;
                document.getElementById('gameOverlay').classList.add('active');
                if (isVictory) SFX.victory();
                else SFX.defeat();
            }

                document.getElementById('gameOverlay').classList.remove('active');

            restart() {
                this.syncCanvasSize();
                this.fitLayout();
                this.reset();
                this.initAIPlayers();
                this.startPreparationPhase();
                this.updateBoardUnitCount();
                this.updateAIPreview();
                this.renderBench();
                this.render();
            }

            _rafLoop(ts) {
                let dt = (ts - this._rafLastTime) / 1000;
                this._rafLastTime = ts;
                dt = Math.min(dt, 0.25); // 防止时间膨胀
                
                this._rafDeltaBuffer.push(dt);
                if (this._rafDeltaBuffer.length > 10) this._rafDeltaBuffer.shift();
                
                this._rafSmoothDt = this._rafDeltaBuffer.reduce((a, b) => a + b, 0) / this._rafDeltaBuffer.length;
                
                // 平滑动画更新 (浮字和弹道)
                if (this.floatDamageElements) {
                    for (const f of this.floatDamageElements) {
                        f.progress += this._rafSmoothDt * 1.5;
                        if (f.progress >= 1) this._releaseFloatDamage(f);
                    }
                }
                
                if (this.attackAnims) {
                    for (let i = this.attackAnims.length - 1; i >= 0; i--) {
                        const anim = this.attackAnims[i];
                        anim.progress += this._rafSmoothDt * 2.5;
                        if (anim.progress >= 1) this._releaseAttackAnim(anim, i);
                    }
                }
                
                // 进行渲染
                if (this.playerBench) {
                    for (const unit of this.playerBench) {
                        if (unit) unit.tickAnim(this._rafSmoothDt * 10);
                    }
                }

                this.render();
                this.renderBenchUnitCanvases();

                requestAnimationFrame(this._rafBoundLoop);
            }

            getLudusMetrics() {
                const units = this.getBoardUnits().filter(u => u.isPlayer);
                if (units.length === 0) return null;

                // 1. PCP (Per-card Payoff)
                const pcps = units.map(u => {
                    const heroData = HEROES[u.heroId];
                    return (heroData.hp + heroData.atk * 3) / heroData.cost;
                });
                const pcpMean = pcps.reduce((a, b) => a + b, 0) / pcps.length;
                const pcpVariance = pcps.reduce((sq, n) => sq + Math.pow(n - pcpMean, 2), 0) / pcps.length;
                const pcpSd = Math.sqrt(pcpVariance).toFixed(1);

                // 2. SDM (Standard Deviation Metric)
                const atks = units.map(u => u.atk);
                const hps = units.map(u => u.hp);
                const atkMean = atks.reduce((a, b) => a + b, 0) / units.length;
                const hpMean = hps.reduce((a, b) => a + b, 0) / units.length;
                const atkSd = Math.sqrt(atks.reduce((sq, n) => sq + Math.pow(n - atkMean, 2), 0) / units.length);
                const hpSd = Math.sqrt(hps.reduce((sq, n) => sq + Math.pow(n - hpMean, 2), 0) / units.length);
                const sdm = ((atkSd + hpSd) / 2).toFixed(1);

                // 3. Entropy Metric (Shannon Entropy of Synergies)
                const synCounts = {};
                let totalSyns = 0;
                units.forEach(u => {
                    u.synergy.forEach(s => {
                        synCounts[s] = (synCounts[s] || 0) + 1;
                        totalSyns++;
                    });
                });
                let entropy = 0;
                if (totalSyns > 0) {
                    Object.values(synCounts).forEach(count => {
                        const p = count / totalSyns;
                        entropy -= p * Math.log2(p);
                    });
                }
                const entropyNormalized = (entropy * 30).toFixed(1); // Scale for readability

                // 4. Counter Score (克制激活度)
                let counterScore = 0;
                // 西天克大唐, 花果山克天庭, 妖族克天庭, 妖族克龙族, 龙族克花果山, 大唐克西天
                if (synCounts['xitian']) counterScore += synCounts['xitian'] * 2;
                if (synCounts['huaguo']) counterScore += synCounts['huaguo'] * 1.5;
                if (synCounts['yaozu']) counterScore += synCounts['yaozu'] * 2.5;
                if (synCounts['longzu']) counterScore += synCounts['longzu'] * 1.5;
                if (synCounts['datang']) counterScore += synCounts['datang'] * 1.5;

                return {
                    pcpSd,
                    sdm,
                    entropy: entropyNormalized,
                    counterScore
                };
            }

            tick() {
                if (this.gameOver) return;
                this.updateUI();

                // 备战阶段：驱动待机动画（idle浮动/受击闪/死亡下沉）
                if (this.phase === 'preparation') {
                    for (const unit of this.getBoardUnits()) {
                        if (unit) unit.tickAnim(1);
                    }
                }
                if (this.phase === 'preparation') {
                    this.phaseTimer -= 0.1;
                    this._updatePhaseBarTimer();
                    if (this.phaseTimer <= 0) this.startDraftPhase();
                } else if (this.phase === 'draft') {
                    this.phaseTimer -= 0.1;
                    this._updatePhaseBarTimer();
                    if (this.phaseTimer <= 0) this.autoSelectDraft();
                } else if (this.phase === 'combat') {
                    for (let s = 0; s < this.combatSpeed; s++) {
                        if (!this.combatOvertime) this.combatTicks--;
                        if (this.combatOvertime || this.combatTicks > 0) this.combatTick();
                        if (this.phase !== 'combat') break;
                        if (!this.combatOvertime && this.combatTicks <= 0) {
                            if (!this.enterCombatOvertime()) this.endCombat();
                            if (this.phase !== 'combat') break;
                        }
                    }
                } else if (this.phase === 'boss') {
                    if (!this.bossOvertime) {
                        this.phaseTimer -= 0.1;
                        if (this.phaseTimer <= 0) {
                            this.phaseTimer = 0;
                            this.bossOvertime = true;
                            this.addLog('⏱️ 野怪回合进入加时，直到一方全灭', 'combat');
                        }
                    }

                    this._updatePhaseBarTimer();
                    this.bossCombatTick();
                }
            }

            // ===== 阶段显示 ===== 更新阶段徽章和计时器
            _showPhaseBar(phase, icon, name, timer) {
                const badge = document.getElementById('phaseBadge');
                const iconMap = { prep: '⏱️', draft: '🎯', boss: '👹', combat: '⚔️' };
                badge.className = `phase-badge ${phase}`;
                if (phase === 'draft') {
                    badge.innerHTML = `<span class="phase-icon-inline draft"></span><span>${name}</span>`;
                } else {
                    badge.textContent = `${iconMap[phase] || '⏱️'} ${name}`;
                }
                document.getElementById('phaseTimerDisplay').textContent = Math.ceil(timer);
            }

            _updatePhaseBarTimer() {
                const timer = document.getElementById('phaseTimerDisplay');
                if (this.phase === 'combat' && this.combatOvertime) {
                    timer.textContent = '∞';
                } else if (this.phase === 'boss' && this.bossOvertime) {
                    timer.textContent = '∞';
                } else {
                    timer.textContent = Math.ceil(this.phaseTimer);
                }

                timer.classList.remove('warning', 'danger');
                if (this.phase === 'preparation') {
                    if (this.phaseTimer <= 5) timer.classList.add('danger');
                    else if (this.phaseTimer <= 10) timer.classList.add('warning');
                } else if (this.phase === 'boss' && !this.bossOvertime) {
                    if (this.phaseTimer <= 5) timer.classList.add('danger');
                    else if (this.phaseTimer <= 10) timer.classList.add('warning');
                }
            }

            _hidePhaseBar() {
                const badge = document.getElementById('phaseBadge');
                badge.className = 'phase-badge';
                badge.textContent = '⏱️ 备战';
            }

            // ========== 选秀系统 ==========
            startDraftPhase() {
                this.phase = 'draft';
                this.phaseTimer = 15;

                // 生成选秀选项（3-5个）
                const draftCount = Math.min(3 + Math.floor(this.playerLevel / 3), 5);
                this.draftOptions = this.drawShopLine(draftCount);

                const container = document.getElementById('draftOptions');
                container.innerHTML = '';
                this.draftOptions.forEach((hero, idx) => {
                    this.renderDraftOption(container, hero, idx);
                });

                // 选秀刷新按钮
                const refreshBtn = document.getElementById('draftRefreshBtn');
                refreshBtn.onclick = () => {
                    if (this.gold < 2) {
                        this.addLog('金币不足!', 'damage');
                        return;
                    }
                    this.gold -= 2;
                    SFX.refresh();
                    // 重刷3张
                    this.draftOptions = this.drawShopLine(3);
                    container.innerHTML = '';
                    this.draftOptions.forEach((hero, idx) => {
                        this.renderDraftOption(container, hero, idx);
                    });
                    this.addLog('🔄 选秀重刷，-2金', 'round');
                    this.updateUI();
                };

                this._showPhaseBar('draft', '🎯', `选秀回合 ${this.round}`, this.phaseTimer);
                document.getElementById('draftOverlay').classList.add('active');
                const draftTitleText = document.getElementById('draftTitleText');
                if (draftTitleText) {
                    draftTitleText.textContent = `选秀回合 ${this.round}`;
                } else {
                    document.getElementById('draftTitle').textContent = `🎯 选秀回合 ${this.round}`;
                }
                this.addLog(`🎯 选秀: ${draftCount}个选项`, 'round');
            }

            selectDraft(index) {
                if (this.phase !== 'draft') return;
                const hero = this.draftOptions[index];
                document.getElementById('draftOverlay').classList.remove('active');
                this._hidePhaseBar();

                const benchCount = this.getBenchUnitCount();
                if (benchCount >= CONFIG.BENCH_SIZE) {
                    this.addLog('备战席已满，未获得选秀英雄', 'damage');
                    this.updateUI();
                    this.startCombatPhase();
                    return;
                }

                const slot = this.getEmptyBenchSlot();
                const unit = new Unit(hero, 1, true);
                unit.game = this;
                unit.itemCallback = (name, a, b, c) => this.addLog(`🔨 合成: ${a}+${b} → ${c}`, 'skill');
                this.playerBench[slot] = unit;
                this.addLog(`✨ 选秀: ${hero.name}`, 'buy');
                this.renderBench();
                this.updateSynergies();
                this.updateUI();
                this.startCombatPhase();
            }

            autoSelectDraft() {
                if (this.phase !== 'draft') return;
                document.getElementById('draftOverlay').classList.remove('active');
                this._hidePhaseBar();
                this.addLog('⏰ 选秀超时，自动选择', 'round');
                this.selectDraft(0);
            }

            // ========== 野怪回合 ==========
            isBossRound() {
                return this.round <= 3;
            }

            startBossPhase() {
                this.phase = 'boss';
                this.phaseTimer = 20;
                this.bossOvertime = false;
                this.bossRageStacks = 0;
                this.bossRageTickCounter = 0;

                this._showPhaseBar('boss', '👹', `野怪回合 ${this.round}`, this.phaseTimer);
                this.capturePlayerFormation();

                // 生成野怪
                this.enemies = [];
                this.enemyPositions = [];
                const bossConfig = [
                    { count: 3, hp: 150, atk: 20, name: '石甲虫' },
                    { count: 4, hp: 200, atk: 25, name: '锋喙鸟' },
                    { count: 3, hp: 300, atk: 35, name: '紫版本野怪' }
                ];
                const cfg = bossConfig[this.round - 1] || bossConfig[2];
                for (let i = 0; i < cfg.count; i++) {
                    const bossUnit = new Unit({
                        id: 'boss', name: cfg.name, cost: 0,
                        hp: cfg.hp, atk: cfg.atk, synergy: [], icon: '👹', tier: 0
                    }, 1, false);
                    bossUnit.game = this;
                    bossUnit.armor = 10;
                    bossUnit.boardRow = i % CONFIG.PLAYER_ZONE_START;
                    bossUnit.boardCol = CONFIG.BOARD_WIDTH - 1 - Math.floor(i / CONFIG.PLAYER_ZONE_START);
                    this.enemies.push(bossUnit);
                    this.enemyPositions.push({ row: bossUnit.boardRow, col: bossUnit.boardCol });
                }

                for (const unit of [...this.getBoardUnits(), ...this.enemies]) {
                    if (!unit) continue;
                    unit.lockedTargetId = null;
                    unit.targetLockTicks = 0;
                    unit.targetSwitchCooldown = 0;
                    unit.hasAssassinJumped = false;
                    unit.holdPositionTicks = 0;
                    unit.lastAttackerId = null;
                    unit.lastAttackerLockTicks = 0;
                }

                this.addLog(`👹 野怪回合: ${cfg.name} x${cfg.count}`, 'combat');
                this.render();
            }

            bossCombatTick() {
                if (this.phase !== 'boss') return;
                const dt = 1;
                this._combatStepDt = dt;
                // 所有存活单位执行tick（回复等）
                for (const unit of [...this.enemies, ...this.getBoardUnits()]) {
                    if (!unit) continue;
                    unit.tickAnim(dt);
                    if (unit.isDead) continue;
                    unit.tick(dt);
                    if (unit.healFlash > 0) {
                        SFX.heal();
                        const p = this.getCellCenter(unit.boardRow, unit.boardCol);
                        this.addFloatDamage(
                            p.x,
                            p.y,
                            Math.floor(unit.healFlash), 'heal'
                        );
                        unit.clearHealFlash();
                    }
                }

                // 收集当前存活的单位（tick后）
                const playerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const aliveEnemies = this.enemies.filter(e => !e.isDead);

                // 攻击+走位阶段
                for (const unit of [...playerUnits, ...aliveEnemies]) {
                    if (!unit || unit.isDead) continue;
                    const targets = unit.isPlayer ? aliveEnemies : playerUnits;

                    this.performAssassinJumpIfNeeded(unit, targets, playerUnits, aliveEnemies);

                    const target = this.pickTarget(unit, targets);
                    if (!target || target.isDead) continue;

                    const dist = this.getDistance(unit, target);
                    const maxRange = unit.range || 1;
                    const minRange = Math.min(unit.minRange || 1, maxRange);
                    const inRange = dist <= maxRange;
                    const tooClose = dist < minRange;

                    if (inRange && !tooClose && unit.canAttack()) {
                        unit.holdPositionTicks = 8;
                        target.triggerHit();
                        const result = unit.performAttack(target);
                        if (result.cast) unit.triggerSkill(target);
                        else unit.triggerAttack(target);
                        if (unit.isPlayer) SFX.attack();
                        const targetPos = this.getCellCenter(target.boardRow, target.boardCol);
                        const unitPos = this.getCellCenter(unit.boardRow, unit.boardCol);
                        const tx = targetPos.x;
                        const ty = targetPos.y;
                        let dmgType = result.crit ? 'crit' : 'damage';
                        if (unit.trueDamageRate > 0) dmgType = 'true';
                        this.addFloatDamage(tx, ty, Math.floor(result.damage), dmgType);
                        const sx = unitPos.x;
                        const sy = unitPos.y;
                        this.attackAnims.push({ sx, sy, tx, ty, startTime: Date.now(), duration: 280, crit: result.crit, fromPlayer: unit.isPlayer, heroId: unit.heroId });
                        if (result.cast) {
                            this.attackAnims.push({ sx, sy, tx: sx, ty: sy, startTime: Date.now(), duration: 420, crit: true, cast: true, fromPlayer: unit.isPlayer, heroId: unit.heroId });
                            this.addFloatDamage(sx, sy - 10, unit.skillName || '技能释放', 'castName');
                        }
                        if (result.skillLog) this.addLog(result.skillLog, 'skill');
                    } else if (tooClose && maxRange > 1) {
                        if (unit.holdPositionTicks > 0) {
                            unit.holdPositionTicks -= dt;
                        } else {
                            this.stepTowardTarget(unit, target, playerUnits, aliveEnemies);
                        }
                    } else if (!inRange) {
                        this.stepTowardTarget(unit, target, playerUnits, aliveEnemies);
                    }
                }

                // 战斗循环结束后再检查：任一方全灭才结束
                const finalPlayerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const finalEnemies = this.enemies.filter(e => !e.isDead);
                if (finalPlayerUnits.length === 0 || finalEnemies.length === 0) {
                    if (this.isDeathAnimationPending()) {
                        this._updatePhaseBarTimer();
                        this.render();
                        return;
                    }
                    this.endBossPhase();
                    return;
                }

                // 清理死亡单位
                // 加时狂暴：每5秒全场攻击与攻速 +10%
                if (this.bossOvertime) {
                    this.bossRageTickCounter += dt;
                    const ticksPerStack = 50; // 5秒（tick间隔100ms）
                    while (this.bossRageTickCounter >= ticksPerStack) {
                        this.bossRageTickCounter -= ticksPerStack;
                        this.bossRageStacks++;
                        for (const unit of [...this.getBoardUnits(), ...this.enemies]) {
                            if (!unit || unit.isDead) continue;
                            unit.atk = Math.floor(unit.atk * 1.1);
                            unit.atkSpeed *= 1.1;
                        }
                        this.addLog(`🔥 加时狂暴 +${this.bossRageStacks * 10}% 攻击/攻速`, 'combat');
                    }
                }

                this._updatePhaseBarTimer();
                this.render();
            }

            endBossPhase() {
                if (this.phase !== 'boss') return;
                this.phase = 'resolving';
                this._hidePhaseBar();

                const playerUnits = this.getBoardUnits().filter(u => !u.isDead);
                const aliveBosses = this.enemies.filter(e => !e.isDead);
                // 玩家胜利条件：所有野怪死亡（aliveBosses.length === 0）
                const playerWon = aliveBosses.length === 0;

                if (!playerWon) {
                    const damage = Math.max(1, aliveBosses.length * 2);
                    this.hp -= damage;
                    this.addLog(`💔 野怪击杀失败! -${damage}HP`, 'damage');
                    this.loseStreak++;
                    this.winStreak = 0;
                    this.pushRoundHistory('失败', `野怪回合 残敌:${aliveBosses.length}`);
                } else {
                    this.addLog('🏆 野怪击杀成功!', 'round');
                    this.winStreak++;
                    this.loseStreak = 0;
                    this.pushRoundHistory('胜利', '野怪回合 完胜');
                    this.gold += CONFIG.WIN_REWARD;
                    // 法宝掉落（第2/3回合掉落）
                    if (this.round >= 2) {
                        const itemKeys = Object.keys(ITEMS);
                        const droppedItem = ITEMS[itemKeys[Math.floor(Math.random() * itemKeys.length)]];
                        const boardUnits = this.getBoardUnits();
                        if (boardUnits.length > 0) {
                            const target = boardUnits[Math.floor(Math.random() * boardUnits.length)];
                            target.items.push(droppedItem);
                            target.recalculateStats();
                            this.addLog(`🎁 法宝: ${droppedItem.icon} ${droppedItem.name} → ${target.name}`, 'round');
                            SFX.drop();
                        }
                    }
                }

                this.updateStreakDisplay();

                this.resetUnitsAfterBattle();

                this.enemies = [];
                this.enemyPositions = [];
                this.round++;
                this.renderBench();
                this.updateUI();

                if (this.hp <= 0) {
                    this.gameOver = true;
                    this.showOverlay(false, this.aiPlayers.filter(a => a.alive).length);
                } else {
                    this.startPreparationPhase();
                }
            }

            // ========== 回合主流程 ==========
            startPreparationPhase() {
                this.phase = 'preparation';
                this.phaseTimer = CONFIG.PREPARATION_TIME;
                this.combatOvertime = false;
                this.combatRageStacks = 0;
                this.combatRageTickCounter = 0;
                this.skippedPrep = false;

                // 基础收入
                this.gold += CONFIG.BASE_INCOME;
                // 连败补偿
                if (this.pendingLoseComp > 0) {
                    this.gold += this.pendingLoseComp;
                    this.addLog(`💔 连败补偿: +${this.pendingLoseComp}金`, 'round');
                    this.pendingLoseComp = 0;
                }
                // 利息收入
                const interest = Math.min(Math.floor(this.gold * CONFIG.INTEREST_RATE), CONFIG.MAX_INTEREST);
                this.gold += interest;
                this.addLog(`💰 回合${this.round}收入: +${CONFIG.BASE_INCOME}基础 +${interest}利息`, 'round');

                this.addLog(`══════════ 回合 ${this.round} ══════════`, 'round');
                // 回合开始时模拟AI行为
                this.simulateAIActions();
                this.updateUI();
                this.refreshShop({ free: true, silent: true });
                this.renderShop();

                this._showPhaseBar('prep', '⏱️', '备战阶段', this.phaseTimer);
                document.getElementById('enemyPreviewInfo').textContent = '等待战斗...';
                this.render();
            }

            skipPreparation() {
                if (this.phase !== 'preparation') return;
                this.skippedPrep = true;
                this.addLog('⏩ 跳过备战，直接进入选秀', 'round');
                this.startDraftPhase();
            }

            startCombatPhase() {
                if (this.isBossRound()) {
                    this.startBossPhase();
                    return;
                }
                this.phase = 'combat';
                this.combatTicks = CONFIG.COMBAT_TICKS;
                this.combatOvertime = false;
                this.combatRageStacks = 0;
                this.combatRageTickCounter = 0;
                this.addLog('⚔️ 战斗开始!', 'combat');

                this.capturePlayerFormation();
                this.spawnEnemies();
                for (const unit of [...this.getBoardUnits(), ...this.enemies]) {
                    if (!unit) continue;
                    unit.lockedTargetId = null;
                    unit.targetLockTicks = 0;
                    unit.targetSwitchCooldown = 0;
                    unit.hasAssassinJumped = false;
                    unit.holdPositionTicks = 0;
                    unit.lastAttackerId = null;
                    unit.lastAttackerLockTicks = 0;
                }
                this.updateEnemyPreview();
                this.renderEnemySynergyPreview();
                this.updateUI();

                this._showPhaseBar('combat', '⚔️', '战斗阶段', this.combatTicks / 10);
                this.render();
            }

            start() {
                this.syncCanvasSize();
                this.fitLayout();
                this.initAIPlayers();
                this.startPreparationPhase();
                this.updateBoardUnitCount();
                setInterval(() => this.tick(), 100);
            }
        }

        // 异步并行加载 PNG 精灵图（带进度跟踪），加载完成后启动游戏。
        // 不能用短暂的单图超时直接放弃：部署后的精灵图较大，慢网络下
        // CSS 头像会最终加载成功，但 Canvas 缓存会永久缺失并退回程序像素图。
        const heroIds = Object.keys(PNG_FILES);
        let loadedCount = 0;
        const totalCount = heroIds.length;
        let gameStarted = false;
        const completedSpriteIds = new Set();

        function updateLoadingProgress(heroId, loaded) {
            if (completedSpriteIds.has(heroId)) return;
            completedSpriteIds.add(heroId);
            loadedCount++;
            const pct = Math.round((loadedCount / totalCount) * 100);
            const bar = document.getElementById('loadingBar');
            const text = document.getElementById('loadingText');
            const hint = document.getElementById('loadingHint');
            if (bar) bar.style.width = pct + '%';
            if (text) text.textContent = `加载资源 ${loadedCount}/${totalCount}...`;
            if (!loaded && hint) {
                hint.textContent = '个别精灵加载失败，正在继续初始化...';
            } else if (loadedCount === totalCount) {
                if (hint) hint.textContent = '资源加载完成，正在初始化游戏...';
            }
        }

        function refreshGameAfterSpriteLoad() {
            if (!window.game) return;
            requestAnimationFrame(() => {
                if (!window.game) return;
                if (typeof window.game.renderBench === 'function') window.game.renderBench();
                if (typeof window.game.renderShop === 'function') window.game.renderShop();
                if (typeof window.game.render === 'function') window.game.render();
            });
        }

        function countFrameColoredPixels(frame) {
            try {
                const ctx2d = frame.getContext('2d');
                const data = ctx2d.getImageData(0, 0, frame.width, frame.height).data;
                let colored = 0;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i+3] > 10 && (data[i] > 5 || data[i+1] > 5 || data[i+2] > 5)) colored++;
                }
                return colored;
            } catch (err) {
                console.warn('[Sprite] 像素诊断被浏览器拦截，已跳过，不影响游戏运行', err);
                return null;
            }
        }

        function showSpriteDiag() {
            const diagEl = document.getElementById('spriteDiag');
            if (!diagEl) return;
            let pngOk = 0, pngFail = 0;
            for (const hid of heroIds) {
                const cache = PNG_SPRITE_CACHE[hid];
                const frames = cache?.idle?.down || [];
                if (frames.length > 0) {
                    const colored = countFrameColoredPixels(frames[0]);
                    if (colored === null || colored > 50) pngOk++; else pngFail++;
                } else {
                    pngFail++;
                }
            }
            diagEl.innerHTML = `<span style="color:${pngFail === 0 ? '#0f0' : pngFail > 0 ? '#ff0' : '#f44'}">精灵图: ${pngOk} 正常, ${pngFail} 失败</span>`;
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.style.display = 'none';
            showSpriteDiag();
            const game = new Game();
            window.game = game;
            game.start();
            if (game.renderBench) game.renderBench();
            if (game.renderShop) game.renderShop();
        }

        function loadSprite(heroId) {
            const filename = PNG_FILES[heroId];
            const path = getPngAssetUrl(filename);
            return new Promise((resolve) => {
                const img = new Image();
                img.decoding = 'async';

                img.onload = () => {
                    let loaded = false;
                    try {
                        PNG_SPRITE_IMAGES[heroId] = img;
                        buildPngSpriteCacheForHero(heroId, img);
                        loaded = Boolean(PNG_SPRITE_CACHE[heroId]?.idle?.down?.length);
                    } catch (err) {
                        console.warn('[Sprite] ' + filename + ' 处理失败', err);
                    }
                    updateLoadingProgress(heroId, loaded);
                    if (loaded) refreshGameAfterSpriteLoad();
                    resolve({ heroId, loaded });
                };

                img.onerror = () => {
                    console.warn('[FAIL] ' + filename);
                    updateLoadingProgress(heroId, false);
                    resolve({ heroId, loaded: false });
                };

                img.src = path;
            });
        }

        async function loadSpritesWithConcurrency(limit = 4) {
            let nextIndex = 0;
            async function worker() {
                while (nextIndex < heroIds.length) {
                    const heroId = heroIds[nextIndex++];
                    await loadSprite(heroId);
                }
            }
            const workerCount = Math.min(limit, heroIds.length);
            await Promise.all(Array.from({ length: workerCount }, () => worker()));
        }

        // 固定 4 路并发，避免弱网/本地代理被 24 个同时 TLS 请求压垮。
        loadSpritesWithConcurrency(4)
            .then(() => {
                try {
                    showSpriteDiag();
                } finally {
                    setTimeout(startGame, 100);
                }
            });

        // 极端网络故障下不永久卡住加载层；迟到的精灵仍会建立缓存并刷新游戏。
        setTimeout(() => {
            if (gameStarted) return;
            const hint = document.getElementById('loadingHint');
            if (hint) hint.textContent = '网络较慢，先进入游戏；精灵加载后会自动刷新...';
            startGame();
        }, 45000);

        // 全局 120 秒超时保险
        setTimeout(() => {
            if (!gameStarted) { console.warn('[Game] 强制启动'); startGame(); }
        }, 120000);


    </script>
