                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.lineTo(points[3].x, points[3].y);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(img, x, y, w, h);
                ctx.restore();
                return true;
            }

            getCellFromEvent(e) {
                const rect = this.canvas.getBoundingClientRect();
                if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return null;
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;
                return this.getCellFromCanvasPoint(x, y);
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.();
                } else {
                    document.exitFullscreen?.();
                }
            }

            fitLayout() {
                const topBar = document.querySelector('.top-bar');
                const bottomBar = document.querySelector('.bottom-bar');
                const boardWrapper = document.querySelector('.board-wrapper');
                const boardSection = document.querySelector('.board-section');

                if (!topBar || !bottomBar || !boardWrapper || !boardSection || !this.canvas) return;

                if (CONFIG.USE_UI_SHELL) {
                    this.canvas.style.width = '100%';
                    this.canvas.style.height = '100%';
                    bottomBar.style.height = '';
                    bottomBar.style.maxHeight = '';
                    bottomBar.style.minHeight = '';
                    boardWrapper.style.flex = '';
                    boardWrapper.style.height = '';
                    boardWrapper.style.alignItems = '';
                    boardWrapper.style.gap = '';
                    boardWrapper.style.marginBottom = '';
                    boardSection.style.padding = '';
                    boardSection.style.display = '';
                    boardSection.style.alignItems = '';
                    boardSection.style.justifyContent = '';
                    boardSection.style.overflow = '';
                    return;
                }

                const viewportW = window.innerWidth;
                const viewportH = window.innerHeight;
                const isFullscreen = !!document.fullscreenElement;
                const lc = isFullscreen ? LAYOUT_CONFIG.fullscreen : LAYOUT_CONFIG.normal;

                if (isFullscreen) {
                    // 底栏高度交给内容自适应，避免出现底部残留空白
                    bottomBar.style.height = 'auto';
                    bottomBar.style.maxHeight = 'none';
                    bottomBar.style.minHeight = '0';
                    bottomBar.style.paddingTop = '0px';
                    bottomBar.style.paddingBottom = '0px';
                    bottomBar.style.lineHeight = '1';
                } else {
                    bottomBar.style.paddingTop = '';
                    bottomBar.style.paddingBottom = '';
                    bottomBar.style.lineHeight = '';
                    bottomBar.style.height = '';
                    bottomBar.style.maxHeight = '';
                    bottomBar.style.minHeight = '';
                }

                const availableW = Math.max(lc.minBoardW, viewportW - lc.sideWidth - lc.boardPadding);
                const availableH = Math.max(lc.minBoardH, viewportH - topBar.offsetHeight - bottomBar.offsetHeight - lc.verticalPadding);

                const scaleW = availableW / this.canvas.width;
                const scaleH = availableH / this.canvas.height;
                const scale = Math.max(lc.minScale, Math.min(lc.maxScale, scaleW, scaleH));

                const canvasPixelW = Math.floor(this.canvas.width * scale);
                const canvasPixelH = Math.floor(this.canvas.height * scale);
                this.canvas.style.width = `${canvasPixelW}px`;
                this.canvas.style.height = `${canvasPixelH}px`;

                if (isFullscreen) {
                    // 让棋盘区吃掉剩余空间，避免底部出现整段空白
                    boardWrapper.style.flex = '1 1 auto';
                    boardWrapper.style.height = 'auto';
                    boardWrapper.style.alignItems = 'stretch';
                    boardWrapper.style.gap = '14px';
                    boardWrapper.style.marginBottom = '0px';

                    boardSection.style.padding = '0px';
                    boardSection.style.display = 'flex';
                    boardSection.style.alignItems = 'center';
                    boardSection.style.justifyContent = 'center';
                    boardSection.style.overflow = 'visible';

                    bottomBar.style.marginTop = '0px';
                } else {
                    boardWrapper.style.flex = '1';
                    boardWrapper.style.height = 'auto';
                    boardWrapper.style.alignItems = 'flex-start';
                    boardWrapper.style.gap = '';
                    boardWrapper.style.marginBottom = '8px';

                    boardSection.style.padding = '';
                    boardSection.style.display = '';
                    boardSection.style.alignItems = '';
                    boardSection.style.justifyContent = '';
                    boardSection.style.overflow = '';

                    bottomBar.style.marginTop = '0px';
                }
            }

            rollShopCost() {
                const prob = CONFIG.SHOP_PROB[this.playerLevel] || [100, 0, 0, 0, 0];
                const roll = Math.random() * 100;
                let cost = 1;
                let cumulative = 0;
                for (let c = 0; c < prob.length; c++) {
                    cumulative += prob[c];
                    if (roll < cumulative) { cost = c + 1; break; }
                }
                return cost;
            }

            // 按当前等级的概率表抽取一张英雄；excludedIds 用来减少同店重复。
            drawShopHero(excludedIds = new Set()) {
                const cost = this.rollShopCost();
                let pool = Object.values(HEROES).filter(h => h.tier === cost && !excludedIds.has(h.id));
                if (pool.length === 0) {
                    pool = Object.values(HEROES).filter(h => h.tier === cost);
                }
                if (pool.length === 0) {
                    pool = this.getAvailableHeroes();
                }
                return pool[Math.floor(Math.random() * pool.length)];
            }

            drawShopLine(count = 5) {
                const line = [];
                const usedIds = new Set();
                for (let i = 0; i < count; i++) {
                    const hero = this.drawShopHero(usedIds);
                    line.push(hero);
                    if (hero) usedIds.add(hero.id);
                }
                return line;
            }

            getAvailableHeroes() {
                const prob = CONFIG.SHOP_PROB[this.playerLevel] || [100, 0, 0, 0, 0];
                const heroes = [];
                for (let cost = 1; cost <= 5; cost++) {
                    if (prob[cost - 1] > 0) {
                        const pool = Object.values(HEROES).filter(h => h.tier === cost);
                        heroes.push(...pool);
                    }
                }
                return heroes;
            }

            canManageEconomy() {
                return this.phase === 'preparation' || this.phase === 'combat' || this.phase === 'boss';
            }

            buyRandomUnit() {
                if (!this.canManageEconomy()) {
                    this.addLog('当前阶段不能购买!', 'damage');
                    return;
                }
                if (this.gold < 1) {
                    this.addLog('金币不足!', 'damage');
                    return;
                }
                const slot = this.getEmptyBenchSlot();
                if (slot === -1) {
                    this.addLog('仓库已满!', 'damage');
                    return;
                }
                const hero = this.drawShopHero();
                const unit = new Unit(hero, 1, true);
                unit.itemCallback = (name, a, b, c) => this.addLog(`🔨 合成: ${a}+${b} → ${c}`, 'skill');
                this.playerBench[slot] = unit;
                this.gold -= 1;
                this.addLog(`购买 ${hero.name}`, 'buy');
                SFX.buy();
                this.renderBench();
                this.refreshShop();
                this.updateSynergies();
                this.updateUI();
            }

            refreshShop(options = {}) {
                const { free = false, silent = false } = options;
                if (!this.canManageEconomy()) return;
                if (!free) {
                    if (this.gold < CONFIG.REFRESH_COST) return;
                    this.gold -= CONFIG.REFRESH_COST;
                }
                this.shop = this.drawShopLine(5);
                this.renderShop();
                this.updateUI();
                if (!silent) SFX.refresh();
            }

            createPreviewUnit(hero, starLevel = 1) {
                return new Unit(hero, starLevel, true);
            }

            getHeroSpriteFirstFrameStyle(heroId) {
                const spriteFile = PNG_FILES[heroId];
                // 图片未真正加载成功时不要设置背景图，交给 emoji 兜底
                if (!spriteFile || !hasHeroSpritePng(heroId)) return '';
                return `background-image:url('${getPngAssetUrl(spriteFile)}');background-size:500% 500%;background-repeat:no-repeat;background-position:left top;`;
            }

            applyHeroSpriteFirstFrame(element, heroId, fallbackIcon = '❓') {
                const spriteFile = PNG_FILES[heroId];
                element.textContent = '';
                element.style.backgroundImage = 'none';
                element.style.backgroundSize = '500% 500%';
                element.style.backgroundRepeat = 'no-repeat';
                element.style.backgroundPosition = 'left top';
                // 只有图片确实加载成功才使用 PNG，否则回退到 emoji，避免卡片显示空白
                if (spriteFile && hasHeroSpritePng(heroId)) {
                    element.style.backgroundImage = `url('${getPngAssetUrl(spriteFile)}')`;
                    return true;
                }
                element.textContent = fallbackIcon;
                return false;
            }

            renderDraftOption(container, hero, idx) {
                const iconStyle = this.getHeroSpriteFirstFrameStyle(hero.id);
                const opt = document.createElement('div');
                opt.className = 'draft-option';
                if (this.getBenchUnitCount() >= CONFIG.BENCH_SIZE) {
                    opt.classList.add('disabled');
                    opt.title = '备战席已满，无法选择';
                }
                opt.innerHTML = `
                    <div class="draft-option-icon sprite-card-icon" style="${iconStyle}">${iconStyle ? '' : hero.icon}</div>
                    <div class="draft-option-name">${hero.name}</div>
                    <div class="draft-option-cost"><span class="coin-icon"></span>${hero.cost}</div>
                `;
                opt.addEventListener('click', () => this.selectDraft(idx));
                opt.addEventListener('mouseenter', (e) => this.showShopTooltip(e, hero));
                opt.addEventListener('mouseleave', () => this.hideTooltip());
                container.appendChild(opt);
            }

            renderShop() {
                const grid = document.getElementById('shopGrid');
                grid.innerHTML = '';
                for (let index = 0; index < 5; index++) {
                    const hero = this.shop[index] || null;
                    if (!hero) {
                        const empty = document.createElement('div');
                        empty.className = 'shop-card empty';
                        empty.setAttribute('aria-label', `空商店槽位 ${index + 1}`);
                        grid.appendChild(empty);
                        continue;
                    }
                    const canAfford = this.gold >= hero.cost;
                    const card = document.createElement('div');
                    card.className = `shop-card tier-${hero.tier} ${!canAfford || !this.canManageEconomy() ? 'disabled' : ''}`;

                    // 尝试用 PNG 精灵第一帧作为背景图，失败则显示 emoji
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'shop-icon';
                    iconDiv.style.display = 'flex';
                    iconDiv.style.alignItems = 'center';
                    iconDiv.style.justifyContent = 'center';

                    const drawn = this.applyHeroSpriteFirstFrame(iconDiv, hero.id, hero.icon);
                    if (!drawn) {
                        iconDiv.textContent = hero.icon;
                        iconDiv.style.fontSize = '26px';
                    }

                    card.appendChild(iconDiv);

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'shop-info';
                    infoDiv.innerHTML = `
                        <div class="shop-name">${hero.name}</div>
                        <div class="shop-stats">HP:${hero.hp} ATK:${hero.atk}</div>
                        <div class="shop-synergy">${hero.synergy.map(s => SYNERGIES[s].name).join('/')}</div>
                    `;
                    card.appendChild(infoDiv);

                    const costDiv = document.createElement('div');
                    costDiv.className = 'shop-cost';
                    costDiv.innerHTML = `<span class="coin-icon"></span>${hero.cost}`;
                    card.appendChild(costDiv);

                    if (canAfford && this.canManageEconomy()) {
                        card.addEventListener('click', () => this.buyFromShop(index));
                    }
                    card.addEventListener('mouseenter', (e) => this.showShopTooltip(e, hero));
                    card.addEventListener('mouseleave', () => this.hideTooltip());
                    grid.appendChild(card);
                }
            }

            getEmptyBenchSlot() {
                for (let i = 0; i < CONFIG.BENCH_SIZE; i++) {
                    if (!this.playerBench[i]) return i;
                }
                return -1;
            }

            getBenchUnitCount() {
                return this.playerBench.filter(u => u).length;
            }

            buyFromShop(index) {
                if (!this.canManageEconomy()) return;
                const hero = this.shop[index];
                if (!hero) return;
                if (this.gold < hero.cost) {
                    this.addLog('金币不足!', 'damage');
                    return;
                }
                const slot = this.getEmptyBenchSlot();
                if (slot === -1) {
                    this.addLog('仓库已满!', 'damage');
                    return;
                }
                const unit = new Unit(hero, 1, true);
                unit.game = this; // 注入游戏引用（甘露盏等法宝需要）
                unit.itemCallback = (name, a, b, c) => this.addLog(`🔨 合成: ${a}+${b} → ${c}`, 'skill');
                this.playerBench[slot] = unit;
                this.gold -= hero.cost;
                this.shop[index] = null;
                this.addLog(`购买 ${hero.name}`, 'buy');
                SFX.buy();
                this.renderBench();
                this.renderShop();
                this.updateSynergies();
                this.updateUI();
            }

            buyExp() {
                if (!this.canManageEconomy()) return;
                if (this.gold < CONFIG.EXP_COST) {
                    this.addLog('金币不足!', 'damage');
                    return;
                }
                if (this.playerLevel >= CONFIG.MAX_LEVEL) {
                    this.addLog('已达最高等级!', 'damage');
                    return;
                }
                this.gold -= CONFIG.EXP_COST;
                this.exp += 4;
                const expNeeded = CONFIG.EXP_PER_LEVEL[this.playerLevel - 1];
                if (this.exp >= expNeeded) {
                    this.exp -= expNeeded;
                    this.playerLevel++;
                    this.addLog(`🎉 升级到 ${this.playerLevel}级! 上限:${this.playerLevel}`, 'round');
                    SFX.levelUp();
                }
                this.updateUI();
                this.updateBenchHint();
            }

            updateBenchHint() {
                const emptySlots = CONFIG.BENCH_SIZE - this.playerBench.filter(u => u).length;
                document.getElementById('benchHint').textContent = `空位: ${emptySlots}`;
            }

            renderBench() {
                const grid = document.getElementById('benchGrid');
                grid.innerHTML = '';
                const mergeableMap = this.getMergeableUnits();
                
                for (let i = 0; i < CONFIG.BENCH_SIZE; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'bench-slot';
                    slot.dataset.index = i;
                    
                    const unit = this.playerBench[i];
                    if (unit) {
                        const mergeKey = `${unit.heroId}_${unit.starLevel}`;
                        const canMerge = mergeableMap[mergeKey] && mergeableMap[mergeKey].count >= 2 && unit.starLevel < 3;
                        slot.classList.add('has-unit');
                        if (canMerge) slot.classList.add('mergeable');
                        slot.innerHTML = this.renderUnitCard(unit, i);
                        slot.dataset.unitIndex = i;
                        slot.addEventListener('pointerdown', (e) => {
                            this.onBenchMouseDown(e, i);
                            // 触摸会产生隐式指针捕获（在 pointerdown 派发之后才建立），
                            // 若不释放，pointerup 会一直派发给本槽位，拖到棋盘时落点判断会失效
                            setTimeout(() => {
                                if (slot.hasPointerCapture && slot.hasPointerCapture(e.pointerId)) {
                                    slot.releasePointerCapture(e.pointerId);
                                }
                            }, 0);
                        });
                        slot.addEventListener('mouseenter', (e) => this.showUnitTooltip(e, unit));
                        slot.addEventListener('mouseleave', () => this.hideTooltip());
                    }
                    slot.addEventListener('mouseenter', () => this.onBenchHover(i));
                    slot.addEventListener('mouseleave', () => this.onBenchLeave(i));
                    slot.addEventListener('pointerup', (e) => this.onBenchDrop(e, i));
                    slot.addEventListener('pointercancel', (e) => this.onBenchDrop(e, i));
                    grid.appendChild(slot);
                }
                this.updateBenchHint();
                this.renderBenchUnitCanvases();
            }

            getMergeableUnits() {
                const map = {};
                for (const unit of this.playerBench) {
                    if (!unit) continue;
                    const key = `${unit.heroId}_${unit.starLevel}`;
                    if (!map[key]) map[key] = { count: 0 };
                    map[key].count++;
                }
                return map;
            }

            renderUnitCard(unit, index) {
                const hpPercent = (unit.hp / unit.maxHp) * 100;
                return `
                    <div class="unit-card">
                        <canvas class="bench-unit-canvas" width="104" height="104" data-bench-index="${index}" data-fallback="${unit.icon || ''}"></canvas>
                    </div>
                `;

                // 备用 emoji 显示（当 PNG 加载失败时，icon div 会显示这个）
                const heroData = HEROES[unit.heroId] || {};
                const fallbackIcon = heroData.icon || '❓';

                const itemsHtml = unit.items && unit.items.length > 0
                    ? `<div class="unit-items">${unit.items.map(i => `<span class="unit-item" title="${i.name}">${i.icon}</span>`).join('')}</div>`
                    : '';
                return `
                    <div class="unit-card">
                        <div class="unit-cost"><span class="coin-icon"></span>${unit.cost}</div>
                        <canvas class="bench-unit-canvas" width="96" height="82" data-bench-index="${index}" data-fallback="${fallbackIcon}"></canvas>
                        <div class="unit-star">${'⭐'.repeat(unit.starLevel)}</div>
                        <div class="unit-name">${unit.name}</div>
                        ${itemsHtml}
                        <div class="unit-hp-bar">
                            <div class="unit-hp-fill" style="width: ${hpPercent}%"></div>
                        </div>
                    </div>
                `;
            }

            renderBenchUnitCanvases() {
                const canvases = document.querySelectorAll('.bench-unit-canvas');
                canvases.forEach(canvas => {
                    const index = Number(canvas.dataset.benchIndex);
                    const unit = this.playerBench[index];
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (!unit) return;

                    const previousState = unit.animState;
                    const previousFacing = unit.facing;
                    unit.animState = 'idle';
                    unit.facing = 'down';
                    const benchStarScale = unit.starLevel >= 3 ? 1.25 : unit.starLevel === 2 ? 1.14 : 1.02;
                    const benchSize = 88 * benchStarScale;
                    this.renderUnitOnCanvas(ctx, unit, (canvas.width - benchSize) / 2, (canvas.height - benchSize) / 2, benchSize, false, { showUi: false });
                    unit.animState = previousState;
                    unit.facing = previousFacing;
                });
            }

            onBenchMouseDown(e, index) {
                if (e.button === 2) {
                    e.preventDefault();
                    this.sellUnit(index);
                } else if (e.button === 0) {
                    const unit = this.playerBench[index];
                    if (unit) {
                        this.draggingUnit = { source: 'bench', index: index, unit: unit };
                        this.showDragPreview(e, unit);
                    }
                }
            }

            onBenchHover(index) {
                if (this.draggingUnit && this.draggingUnit.source === 'bench') {
                    const slot = document.querySelector(`[data-index="${index}"]`);
                    if (slot && index !== this.draggingUnit.index) slot.classList.add('drag-over');
                }
            }

            onBenchLeave(index) {
                const slot = document.querySelector(`[data-index="${index}"]`);
                if (slot) slot.classList.remove('drag-over');
            }

            onBenchDrop(e, index) {
                if (e.button !== 0 || !this.draggingUnit) return;
                // 触摸拖拽时 pointerup 可能仍派发给起始槽位（隐式指针捕获），
                // 只有指针确实落在该槽位范围内才按"放回备战席"处理，
                // 否则直接返回，交给 document 上的 onDragEnd 按棋盘落点放置
                const target = e.currentTarget;
                if (target && typeof target.getBoundingClientRect === 'function') {
                    const r = target.getBoundingClientRect();
                    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
                    if (!inside) return;
                }

                if (this.draggingUnit.source === 'board') {
                    const srcRow = this.draggingUnit.row;
                    const srcCol = this.draggingUnit.col;
                    const unit = this.playerBoard[srcRow][srcCol];
                    if (unit) {
                        const existing = this.playerBench[index];
                        if (existing) {
                            if (this.canMerge(unit, existing)) {
                                this.mergeUnits(unit, existing, 'bench', index);
                                this.playerBoard[srcRow][srcCol] = null;
                            } else {
                                // board <-> bench swap
                                this.playerBoard[srcRow][srcCol] = existing;
                                existing.boardRow = srcRow;
                                existing.boardCol = srcCol;
                                existing.zoneBonus = (srcRow === 4) ? 'tank' : (srcRow >= 5 && srcRow <= 6) ? 'warrior' : 'dps';
                                existing._applyZoneBonus();
                                this.playerBench[index] = unit;
                                unit.boardRow = null;
                                unit.boardCol = null;
                                unit.zoneBonus = null;
                            }
                        } else {
                            // board -> empty bench
                            this.playerBoard[srcRow][srcCol] = null;
                            this.playerBench[index] = unit;
                            unit.boardRow = null;
                            unit.boardCol = null;
                            unit.zoneBonus = null;
                        }
                    }
                } else if (this.draggingUnit.source === 'bench' && index !== this.draggingUnit.index) {
                    const fromIndex = this.draggingUnit.index;
                    const fromUnit = this.playerBench[fromIndex];
                    const toUnit = this.playerBench[index];
                    if (fromUnit) {
                        if (toUnit && this.canMerge(fromUnit, toUnit)) {
                            this.mergeUnits(fromUnit, toUnit, 'bench', index);
                            this.playerBench[fromIndex] = null;
                        } else if (toUnit) {
                            // bench <-> bench swap
                            this.playerBench[fromIndex] = toUnit;
                            this.playerBench[index] = fromUnit;
                        } else {
                            // bench -> empty bench
                            this.playerBench[fromIndex] = null;
                            this.playerBench[index] = fromUnit;
                        }
                    }
                }
                this.draggingUnit = null;
                this.hideDragPreview();
                this.renderBench();
                this.updateSynergies();
                this.render();
            }

            showDragPreview(e, unit) {
                const preview = document.getElementById('dragPreview');
                const drawn = this.applyHeroSpriteFirstFrame(preview, unit.heroId, unit.icon);
                preview.style.backgroundRepeat = 'no-repeat';
                preview.style.backgroundPosition = 'left top';
                preview.style.width = '44px';
                preview.style.height = '44px';
                preview.textContent = drawn ? '' : unit.icon;
                preview.style.display = 'block';
                preview.style.left = e.clientX + 'px';
                preview.style.top = e.clientY + 'px';
            }

            hideDragPreview() {
                document.getElementById('dragPreview').style.display = 'none';
            }

            onDragMove(e) {
                if (!this.draggingUnit) return;

                document.getElementById('dragPreview').style.left = e.clientX + 'px';
                document.getElementById('dragPreview').style.top = e.clientY + 'px';

                this.hoveredCell = this.getCellFromEvent(e);
                this.render();
            }

            onDragEnd(e) {
                if (!this.draggingUnit) return;

                const cell = this.getCellFromEvent(e);
                if (cell) {
                    this.placeUnitOnBoard(this.draggingUnit, cell.row, cell.col);
                }

                document.querySelectorAll('.bench-slot.drag-over').forEach(s => s.classList.remove('drag-over'));
                this.hoveredCell = null;
                this.draggingUnit = null;
                this.hideDragPreview();
                this.render();
            }

            onCanvasMouseDown(e) {
                if (this.phase !== 'preparation') return;
                if (e.button === 2) return;

                const cell = this.getCellFromEvent(e);
                if (!cell) return;
                const { row, col } = cell;

                if (row >= CONFIG.PLAYER_ZONE_START && row < CONFIG.BOARD_HEIGHT) {
                    const unit = this.playerBoard[row][col];
                    if (unit) {
                        e.preventDefault();
                        this.draggingUnit = { source: 'board', row: row, col: col, unit: unit };
                        this.showDragPreview(e, unit);
                    }
                }
            }

            placeUnitOnBoard(dragData, row, col) {
                // ── 提前退出路径：补充拖放清理 ──
                if (row < CONFIG.PLAYER_ZONE_START) { this.hideDragPreview(); this.draggingUnit = null; return; }

                const srcRow = dragData.source === 'board' ? dragData.row : null;
                const srcCol = dragData.source === 'board' ? dragData.col : null;

                let unit;
                if (dragData.source === 'bench') {
                    unit = this.playerBench[dragData.index];
                } else if (dragData.source === 'board') {
                    unit = this.playerBoard[srcRow][srcCol];
                }
                if (!unit) { this.hideDragPreview(); this.draggingUnit = null; return; }

                // 防止自己拖到自己（棋盘→棋盘同一格）
                if (dragData.source === 'board' && srcRow === row && srcCol === col) {
                    this.hideDragPreview(); this.draggingUnit = null; return;
                }

                const existing = this.playerBoard[row][col];
                if (existing) {
                    if (this.canMerge(unit, existing)) {
                        this.mergeUnits(unit, existing, 'board', null, row, col);
                        if (dragData.source === 'bench') {
                            this.playerBench[dragData.index] = null;
                        } else if (dragData.source === 'board') {
                            this.playerBoard[srcRow][srcCol] = null;
                        }
                    } else {
                        if (dragData.source === 'board') {
                            // board <-> board swap
                            this.playerBoard[srcRow][srcCol] = existing;
                            existing.boardRow = srcRow;
                            existing.boardCol = srcCol;
                            existing.zoneBonus = (srcRow >= 5) ? 'tank' : (srcRow >= 3) ? 'warrior' : 'dps';
                            existing._applyZoneBonus();
                        } else {
                            // bench -> occupied board
                            this.playerBench[dragData.index] = existing;
                            existing.boardRow = null;
                            existing.boardCol = null;
                        }

                        this.playerBoard[row][col] = unit;
                        unit.boardRow = row;
                        unit.boardCol = col;
                    }
                } else {
                    const boardUnits = this.getBoardUnitsCount();
                    if (boardUnits >= this.playerLevel && dragData.source === 'bench') {
                        this.addLog(`棋盘已达上限(${this.playerLevel})!`, 'damage');
                        this.hideDragPreview(); this.draggingUnit = null; return;
                    }

                    if (dragData.source === 'bench') {
                        this.playerBench[dragData.index] = null;
                    } else if (dragData.source === 'board') {
                        this.playerBoard[srcRow][srcCol] = null;
                    }

                    this.playerBoard[row][col] = unit;
                    unit.boardRow = row;
                    unit.boardCol = col;
                    // 阵法位置加成
                    unit.zoneBonus = (row === 4) ? 'tank' : (row >= 5 && row <= 6) ? 'warrior' : 'dps';
                    unit._applyZoneBonus();
                }
                this.hideDragPreview();
                this.draggingUnit = null;
                this.renderBench();
                this.updateSynergies();
                this.updateBoardUnitCount();
                this.render();
            }

            getBoardUnitsCount() {
                let count = 0;
                for (let r = 0; r < CONFIG.BOARD_HEIGHT; r++) {
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                        if (this.playerBoard[r][c]) count++;
                    }
                }
                return count;
            }

            updateBoardUnitCount() {
                const count = this.getBoardUnitsCount();
                const max = this.playerLevel;
                document.getElementById('boardUnitCount').textContent = count;
                document.getElementById('boardUnitMax').textContent = max;
            }

            canMerge(unit1, unit2) {
                if (!unit1 || !unit2) return false;
                if (unit1 === unit2) return false;
                return unit1.heroId === unit2.heroId && unit1.starLevel < 3 && unit2.starLevel < 3 && unit1.starLevel === unit2.starLevel;
            }

            mergeUnits(unit1, unit2, target, targetIndex, boardRow, boardCol) {
                if (!unit1 || !unit2) return;
                const newStar = unit1.starLevel + 1;
                const merged = new Unit(HEROES[unit1.heroId], newStar, true);
                merged.hp = merged.maxHp;
                if (target === 'bench') {
                    this.playerBench[targetIndex] = merged;
                } else {
                    this.playerBoard[boardRow][boardCol] = merged;
                    merged.boardRow = boardRow;
                    merged.boardCol = boardCol;
                }
                this.addLog(`✨ ${unit1.name} → ${newStar}星!`, 'skill');
                SFX.merge();
                // 合并法宝（两个棋子的法宝合并，自动触发合成）
                merged.zoneBonus = merged.boardRow === 4 ? 'tank' : (merged.boardRow >= 5 && merged.boardRow <= 6) ? 'warrior' : 'dps';
                merged.items = [...(unit1.items || []), ...(unit2.items || [])];
                merged.recalculateStats();
                merged.itemCallback = (name, a, b, c) => this.addLog(`🔨 合成: ${a}+${b} → ${c}`, 'skill');
                this.updateSynergies();
                this.renderBench();
                this.updateUI();
            }

            sellUnit(index) {
                if (this.phase !== 'preparation') return;
                const unit = this.playerBench[index];
                if (!unit) return;
                const refund = unit.cost * (unit.starLevel === 1 ? 1 : unit.starLevel === 2 ? 2 : 4);
                this.gold += refund;
                this.playerBench[index] = null;
                this.totalUnitsSold++;
                this.addLog(`出售 ${unit.name}, +${refund}金`, 'sell');
                SFX.sell();
                this.renderBench();
                this.updateSynergies();
                this.updateUI();
            }

            onCanvasMouseMove(e) {
                const cell = this.getCellFromEvent(e);

                if (cell) {
                    const { row, col } = cell;
                    this.hoveredCell = cell;

                    // 棋盘悬停显示单位属性（我方+敌方，按实际占格优先）
                    let hoverUnit = this.playerBoard[row][col];
                    if (!hoverUnit) {
                        const enemyIndex = this.getEnemyAtPosition(row, col);
                        if (enemyIndex >= 0) hoverUnit = this.enemies[enemyIndex];
                    }

                    if (hoverUnit) {
                        this.hoveredUnit = hoverUnit;
                        this.showUnitTooltip(e, hoverUnit);
                    } else {
                        this.hoveredUnit = null;
                        this.hideTooltip();
                    }
                } else {
                    this.hoveredCell = null;
                    this.hoveredUnit = null;
                    this.hideTooltip();
                }
                this.render();
            }

            onCanvasMouseLeave() {
                this.hoveredCell = null;
                this.hoveredUnit = null;
                this.hideTooltip();
                this.render();
            }

            onCanvasRightClick(e) {
                e.preventDefault();
                if (this.phase !== 'preparation') return;

                const cell = this.getCellFromEvent(e);
                if (!cell) return;
                const { row, col } = cell;
                
                if (row >= CONFIG.PLAYER_ZONE_START && row < CONFIG.BOARD_HEIGHT) {
                    const unit = this.playerBoard[row][col];
                    if (unit) {
                        const refund = unit.cost * (unit.starLevel === 1 ? 1 : unit.starLevel === 2 ? 2 : 4);
                        this.gold += refund;
                        this.playerBoard[row][col] = null;
                        this.totalUnitsSold++;
                        this.addLog(`出售 ${unit.name}, +${refund}金`, 'sell');
                        SFX.sell();
                        this.updateSynergies();
                        this.updateBoardUnitCount();
                        this.updateUI();
                        this.render();
                    }
                }
            }

            render() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const hasBoardBackground = !CONFIG.USE_UI_SHELL && BOARD_BACKGROUND_IMAGE.complete && BOARD_BACKGROUND_IMAGE.naturalWidth > 0;
                const drawFallbackBoard = !CONFIG.USE_UI_SHELL && !hasBoardBackground;
                if (hasBoardBackground) {
                    ctx.drawImage(BOARD_BACKGROUND_IMAGE, 0, 0, this.canvas.width, this.canvas.height);
                } else if (drawFallbackBoard) {
                    ctx.fillStyle = '#0a0a15';
                    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                const rangePreviewUnit = !this.draggingUnit && this.hoveredUnit && !this.hoveredUnit.isDead
                    ? this.hoveredUnit
                    : null;

                for (let r = 0; r < CONFIG.BOARD_HEIGHT; r++) {
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                        const cell = this.getCellRect(r, c);
                        const x = cell.x;
                        const y = cell.y;
                        const cellW = cell.w;
                        const cellH = cell.h;
                        const quad = cell.quad;
                        const isHovered = this.hoveredCell && this.hoveredCell.row === r && this.hoveredCell.col === c;
                        const isPlayerZone = r >= CONFIG.PLAYER_ZONE_START;
                        const playerUnit = this.playerBoard[r][c];
                        const enemyIndex = this.getEnemyAtPosition(r, c, true);
                        const hasVisibleUnit = !!playerUnit || (enemyIndex >= 0 && !!this.enemies[enemyIndex]);

                        if (drawFallbackBoard) {
                            let baseColor;
                            if (r < CONFIG.PLAYER_ZONE_START) {
                                baseColor = (r + c) % 2 === 0 ? '#2d1010' : '#241010';
                            } else if (r === 4) {
                                baseColor = (r + c) % 2 === 0 ? '#122d40' : '#102540';
                            } else if (r >= 5 && r <= 6) {
                                baseColor = (r + c) % 2 === 0 ? '#0f2a1e' : '#0c2418';
                            } else {
                                baseColor = (r + c) % 2 === 0 ? '#2a1040' : '#220d38';
                            }
                            ctx.fillStyle = baseColor;
                            this.traceCellQuad(ctx, quad);
                            ctx.fill();

                            const borderColor = isPlayerZone
                                ? (r === 4 ? '#2a5a5a' : r >= 5 && r <= 6 ? '#2a5a40' : '#4a2a6a')
                                : '#5a2a2a';
                            ctx.strokeStyle = borderColor;
                            ctx.lineWidth = 2;
                            this.traceCellQuad(ctx, quad);
                            ctx.stroke();
                        }

                        if (this.showRangeHints && rangePreviewUnit && Number.isFinite(rangePreviewUnit.boardRow) && Number.isFinite(rangePreviewUnit.boardCol)) {
                            const dist = Math.abs(rangePreviewUnit.boardRow - r) + Math.abs(rangePreviewUnit.boardCol - c);
                            if (dist > 0) {
                                const minRange = rangePreviewUnit.minRange || 1;
                                const maxRange = rangePreviewUnit.range || 1;
                                const hasActiveSkill = rangePreviewUnit.skillName && rangePreviewUnit.skillName !== '普通攻击';
                                if (hasActiveSkill && dist <= Math.min(2, maxRange)) {
                                    this.drawCellOverlayImage(ctx, quad, UI_EFFECT_IMAGES.tileSkillRange, 0.14, 0.16);
                                }
                                if (dist >= minRange && dist <= maxRange) {
                                    this.drawCellOverlayImage(ctx, quad, UI_EFFECT_IMAGES.tileAttackRange, 0.18, 0.15);
                                }
                            }
                        }

                        if (isHovered && this.draggingUnit) {
                            const boardUnits = this.getBoardUnitsCount();
                            const overCap = !isPlayerZone || (this.draggingUnit.source === 'bench' && boardUnits >= this.playerLevel && !this.playerBoard[r][c]);
                            const overlayImg = overCap ? UI_EFFECT_IMAGES.tileBlocked : UI_EFFECT_IMAGES.tilePlaceable;
                            const usedImage = this.drawCellOverlayImage(ctx, quad, overlayImg, overCap ? 0.88 : 0.82, 0.12);
                            if (!usedImage) {
                                ctx.save();
                                ctx.globalAlpha = overCap ? 0.16 : 0.12;
                                ctx.fillStyle = overCap ? '#ff0000' : '#00ff88';
                                this.traceCellQuad(ctx, quad, 0.16);
                                ctx.fill();
                                ctx.restore();
                            }
                            this.drawCellCornerMarkers(ctx, quad, overCap ? '#ff6666' : '#66ffbb', 0.92, 0.13, 0.25);
                        } else if (isHovered) {
                            const overlayImg = hasVisibleUnit ? UI_EFFECT_IMAGES.tileSelected : UI_EFFECT_IMAGES.tileHover;
                            this.drawCellOverlayImage(ctx, quad, overlayImg, hasVisibleUnit ? 0.72 : 0.62, 0.14);
                            this.drawCellCornerMarkers(ctx, quad, isPlayerZone ? '#ffd76a' : '#ff6666', 0.62, 0.16, 0.22);
                        }
                        
                        const renderBox = this.getCellRenderBox(r, c);
                        const baseUnitSize = Math.min(renderBox.width, renderBox.height);
                        const drawUnitAtCell = (unit, enemyFlag) => {
                            const starVisualScale = unit.starLevel >= 3 ? 1.62 : unit.starLevel === 2 ? 1.34 : 1.08;
                            const unitSize = baseUnitSize * starVisualScale;
                            const unitX = renderBox.center.x - unitSize / 2;
                            const unitY = renderBox.center.y - unitSize / 2;
                            this.renderUnitOnCanvas(ctx, unit, unitX, unitY, unitSize, enemyFlag);
                        };
                        if (playerUnit) {
                            drawUnitAtCell(playerUnit, false);
                        }
                        if (enemyIndex >= 0 && this.enemies[enemyIndex]) {
                            drawUnitAtCell(this.enemies[enemyIndex], true);
                        }
                    }
                }
                
                this.renderFloatDamage(ctx);
                this.renderAttackAnims(ctx);
            }

            getEnemyAtPosition(row, col, includeDead = false) {
                for (let i = 0; i < this.enemies.length; i++) {
                    const enemy = this.enemies[i];
                    if (enemy && (includeDead || !enemy.isDead) && enemy.boardRow === row && enemy.boardCol === col) {
                        return i;
                    }
                }
                return -1;
            }

            renderUnitOnCanvas(ctx, unit, x, y, size, isEnemy, options = {}) {
                const centerX = x + size / 2;
                const centerY = y + size / 2;
                const showUnitUi = options.showUi !== false;

                // === 动画偏移量计算 ===
                let offsetX = 0;
                let offsetY = 0;
                const now = Date.now();

                if (unit.isDead) {
                    ctx.globalAlpha = Math.max(0.1, unit.deathAlpha || 0.3);
                    // 死亡：下沉 + 半透明
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.scale(0.92, 0.92);
                    ctx.translate(-centerX, -centerY);
                }

                // 1. 呼吸待机动画（idle浮动）
                const idleFloat = Math.sin(now / 550 + unit.floatPhase) * 2.8;

                // 2. 攻击突脸动画
                if (unit.animState === 'attack') {
                    const progress = 1 - Math.min(1, unit.animTimer / CONFIG.ATTACK_ANIM_TICKS);
                    const dir = isEnemy ? -1 : 1;
                    // 突进（前1/3）+ 回弹（后2/3）
                    if (progress < 0.35) {
                        const t = progress / 0.35;
                        offsetX = dir * t * size * 0.45;
                        offsetY = -t * 4;
                    } else {
                        const t = (progress - 0.35) / 0.65;
                        offsetX = dir * (1 - t) * size * 0.45;
                        offsetY = -4 * (1 - t);
                    }
                }

                // 3. 受击抖动（比attack先检查，因为同帧可能先hit再attack）
                if (unit.animState === 'hit' || unit.hitFlashTimer > 0) {
                    const hitIntensity = Math.min(1, (unit.hitFlashTimer || 0) / CONFIG.HIT_ANIM_TICKS);
                    offsetX += Math.sin(now / 18) * 4.5 * hitIntensity;
                    offsetY += Math.cos(now / 13) * 2.5 * hitIntensity;
                }

                // 4. 行走微微弹跳（用idle浮动代替，保持连贯）
                const walkBounce = unit.animState === 'walk'
                    ? Math.abs(Math.sin(now / 120)) * 3
                    : 0;

                // 合成最终偏移
                const finalX = centerX + offsetX;
                const finalY = centerY + idleFloat + offsetY - walkBounce;

                // === 受击红光叠加层 ===
                const hitFlash = unit.hitFlashTimer > 0
                    ? Math.sin(unit.hitFlashTimer * 0.9) * 0.5 + 0.5
                    : 0;

                if (unit.isDead) {
                    ctx.globalAlpha = Math.max(0.1, unit.deathAlpha || 0.3);
                }

                if (this.draggingUnit && !isEnemy && !unit.isDead) {
                    if (this.draggingUnit.source === 'board' &&
                        this.draggingUnit.row === unit.boardRow &&
                        this.draggingUnit.col === unit.boardCol) {
                        ctx.globalAlpha = 0.3;
                    }
                }

                // === 受击红色闪烁叠加 ===
                if (hitFlash > 0) {
                    ctx.save();
                    ctx.globalAlpha = hitFlash * 0.55;
                    ctx.fillStyle = '#ff3333';
                    ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
                    ctx.restore();
                }

                // === 单位本体（像素精灵） ===
                const hasSprite = PNG_SPRITE_CACHE[unit.heroId] !== undefined || HERO_SPRITES[unit.heroId] !== undefined;
                if (hasSprite) {
                    const spriteData = HERO_SPRITES[unit.heroId];
                    const stateFrames = (spriteData && (spriteData[unit.animState] || spriteData.idle)) || [[]];
                    const pngCache = PNG_SPRITE_CACHE[unit.heroId];
                    const facing = (unit.facing && ['down', 'left', 'right', 'up'].includes(unit.facing)) ? unit.facing : 'down';
                    const renderFacing = PNG_RENDER_FACING_MAP[facing] || 'down';
                    const stateMap = pngCache && (pngCache[unit.animState] || pngCache.idle);
                    const pngFrames = stateMap && (stateMap[renderFacing] || stateMap.down || []);
                    const pngLen = pngFrames && pngFrames.length ? pngFrames.length : 0;
                    const frameIdx = pngLen > 0
                        ? unit.animFrameIdx % pngLen
                        : Math.floor(Date.now() / 500) % Math.max(1, stateFrames.length);
                    // Scale sprites with the visual board cell so the new art margins stay readable.
                    const pixelSize = Math.max(4, Math.min(11, size / 9.8));
                    const spriteOffsetY = -Math.max(5, Math.round(size * 0.13));
                    const flashColor = unit.healFlash > 0 ? '#ccffcc' : null;
                    SpriteRenderer.draw(
                        ctx, unit.heroId, unit.animState, frameIdx, facing,
                        finalX, finalY + spriteOffsetY, pixelSize, isEnemy, unit.starLevel, flashColor
                    );
                } else {
                    // 回退：emoji
                    ctx.font = '34px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(unit.icon, finalX, finalY - 3);
                }

                // 攻击动画：武器挥动弧线（攻击状态下画弧线）
                if ((unit.animState === 'attack' || unit.animState === 'skill') && unit.animTimer > 4) {
                    const totalAnimTicks = unit.animState === 'skill' ? CONFIG.SKILL_ANIM_TICKS : CONFIG.ATTACK_ANIM_TICKS;
                    const arcProgress = 1 - unit.animTimer / totalAnimTicks;
                    ctx.save();
                    if (unit.animState === 'skill') {
                        ctx.globalAlpha = Math.max(0, 0.8 - arcProgress * 0.5);
                        ctx.strokeStyle = isEnemy ? '#ff6644' : '#66d9ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(finalX - size * 0.34, finalY - size * 0.34, size * 0.68, size * 0.68);
                    } else {
                        ctx.globalAlpha = 0.7;
                        ctx.strokeStyle = '#ffee44';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        const arcX = finalX + (isEnemy ? -1 : 1) * size * 0.3;
                        const arcY = finalY - 4;
                        ctx.arc(arcX, arcY, size * 0.28,
                            (isEnemy ? Math.PI * 0.6 : -Math.PI * 0.6) + arcProgress * Math.PI * 0.8,
                            (isEnemy ? Math.PI * 0.8 : -Math.PI * 0.8) + arcProgress * Math.PI * 0.8
                        );
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                if (unit.isDead) {
                    ctx.restore();
                    return;
                }

                if (!showUnitUi) {
                    ctx.globalAlpha = 1;
                    return;
                }

                ctx.globalAlpha = 1;

                // === 血条 ===
                const hpPercent = Math.max(0, unit.hp / unit.maxHp);
                const barWidth = size - 12;
                const barHeight = 10;
                const barX = x + 6;
                const barY = y + size - 15;
                const hpBarImg = UI_EFFECT_IMAGES[isEnemy ? 'hpBarRed' : 'hpBarGreen'];
                const hpSegImg = UI_EFFECT_IMAGES[isEnemy ? 'hpSegmentRed' : 'hpSegmentGreen'];

                if (hpBarImg && hpSegImg && hpBarImg.complete && hpSegImg.complete && hpBarImg.naturalWidth > 0 && hpSegImg.naturalWidth > 0) {
                    ctx.drawImage(hpBarImg, barX, barY, barWidth, barHeight);
                    const segments = 10;
                    const filledSegs = Math.round(hpPercent * segments);
                    const innerX = barX + 5;
                    const innerY = barY + 2;
                    const gap = 1;
                    const segW = (barWidth - 10 - gap * (segments - 1)) / segments;
                    const segH = barHeight - 4;
                    for (let s = 0; s < filledSegs; s++) {
                        ctx.drawImage(hpSegImg, innerX + s * (segW + gap), innerY, segW, segH);
                    }
                } else {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(barX, barY, barWidth, barHeight);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(barX, barY + barHeight, barWidth, 1);

                    let hpColor = isEnemy ? '#ff2222' : '#22ff88';
                    if (hpPercent <= 0.25) hpColor = isEnemy ? '#ff0000' : '#ff2222';
                    else if (hpPercent <= 0.5) hpColor = isEnemy ? '#ff5500' : '#ffaa00';

                    const segmentW = 8;
                    const segments = Math.ceil(barWidth / segmentW);
                    const filledSegs = Math.round(hpPercent * segments);
                    for (let s = 0; s < filledSegs; s++) {
                        const sx = barX + s * segmentW;
                        const sw = Math.min(segmentW, barX + barWidth - sx);
                        ctx.fillStyle = hpColor;
                        ctx.fillRect(sx, barY, sw - 1, barHeight);
                    }
                }
                // 低血量时血条抖动
                if (hpPercent < 0.25 && !unit.isDead) {
                    const shakeH = Math.sin(now / 80) * 1.2;
                    ctx.fillStyle = 'rgba(255,0,0,0.15)';
                    ctx.fillRect(barX + shakeH, barY, barWidth, barHeight);
                }

                // === 蓝条 ===
                const manaPercent = Math.max(0, Math.min(1, (unit.mana || 0) / (unit.maxMana || 100)));
                const manaY = barY - 10;
                const manaSegW = 6;
                const manaSegs = Math.ceil(barWidth / manaSegW);
                const filledManaSegs = Math.round(manaPercent * manaSegs);

                ctx.fillStyle = '#0a1a2a';
                ctx.fillRect(barX, manaY, barWidth, 4);
                for (let s = 0; s < filledManaSegs; s++) {
                    const sx = barX + s * manaSegW;
                    const sw = Math.min(manaSegW, barX + barWidth - sx);
                    ctx.fillStyle = s === filledManaSegs - 1 ? '#00eeff' : '#0088cc';
                    ctx.fillRect(sx, manaY, sw - 1, 4);
                }

                // === 敌方红边框 ===
                if (isEnemy) {
                    ctx.save();
                    ctx.globalAlpha = 0.34;
                    ctx.strokeStyle = '#ff4444';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(x + 6, y + 6, size - 12, size - 12);
                    ctx.restore();
                }

                // 星级只通过棋子体型体现，棋盘上不再额外绘制星级符号。

                // === 法宝图标 ===
                if (!isEnemy && unit.items && unit.items.length > 0) {
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'left';
                    unit.items.forEach((item, idx) => {
                        ctx.fillText(item.icon, x + 4 + idx * 10, y + size - 16);
                    });
                    ctx.textAlign = 'center';
                }

                if (unit.isDead) ctx.restore();
            }

            addFloatDamage(x, y, value, type) {
                // type: 'damage' | 'crit' | 'heal' | 'true' | 'castName'
                this.floatDamageElements.push({ x, y, value, type, startTime: Date.now(), duration: type === 'castName' ? 900 : 800 });
            }

            renderFloatDamage(ctx) {
                const now = Date.now();
                this.floatDamageElements = this.floatDamageElements.filter(f => {
                    const elapsed = now - f.startTime;
                    if (elapsed >= f.duration) return false;

                    const progress = elapsed / f.duration;
                    const alpha = 1 - progress;
                    const offsetY = -20 * progress;
                    const offsetX = (Math.random() - 0.5) * 3;

                    // 像素色阶配色
                    let size = 11, color = '#ff2222', prefix = '', glowColor = '#ff2222';
                    if (f.type === 'crit') {
                        size = 15; color = '#ee44ff'; glowColor = '#aa00ff'; prefix = 'CRIT';
                    } else if (f.type === 'heal') {
                        size = 12; color = '#00ffdd'; glowColor = '#00bb88'; prefix = '+';
                    } else if (f.type === 'true') {
                        size = 13; color = '#cc44ff'; glowColor = '#8800cc'; prefix = '◆';
                    } else if (f.type === 'castName') {
                        size = 11; color = '#ffaa00'; glowColor = '#cc8800'; prefix = '';
                    }

                    ctx.save();
                    ctx.font = `bold ${size}px "Press Start 2P", monospace`;
                    ctx.textAlign = 'center';
                    ctx.globalAlpha = alpha;
                    // 像素发光（硬边，无 blur）
                    ctx.fillStyle = glowColor;
                    const tx = Math.round(f.x + offsetX);
                    const ty = Math.round(f.y + offsetY);
                    ctx.fillText(`${prefix}${f.value}`, tx + 1, ty + 1);
                    // 亮核
                    ctx.fillStyle = color;
                    ctx.fillText(`${prefix}${f.value}`, tx, ty);
                    ctx.restore();

                    return true;
                });
            }

            // 渲染攻击轨迹动画
            renderAttackAnims(ctx) {
                const now = Date.now();
                this.attackAnims = this.attackAnims.filter(anim => {
                    const elapsed = now - anim.startTime;
                    if (elapsed >= anim.duration) return false;

                    const progress = elapsed / anim.duration;

                    if (anim.cast) {
                        const alpha = 1 - progress;
                        const radius = 10 + progress * 22;
                        const castColor = anim.fromPlayer ? '#00ddff' : '#ff4444';
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = castColor;
                        // 像素扩散圈（用8个矩形模拟圆弧像素化）
                        for (let a = 0; a < 8; a++) {
                            const angle = (a / 8) * Math.PI * 2;
                            const px = Math.round(anim.sx + Math.cos(angle) * radius - 3);
                            const py = Math.round(anim.sy + Math.sin(angle) * radius - 3);
                            ctx.fillRect(px, py, 6, 6);
                        }
                        ctx.restore();
                        return true;
                    }

                    // 像素块弧线轨迹
                    const t = progress;
                    const midX = (anim.sx + anim.tx) / 2;
                    const midY = (anim.sy + anim.ty) / 2 - 30;
                    const bx = (1-t)*(1-t)*anim.sx + 2*(1-t)*t*midX + t*t*anim.tx;
                    const by = (1-t)*(1-t)*anim.sy + 2*(1-t)*t*midY + t*t*anim.ty;

                    // 有精灵的英雄：用精灵投射物；否则用像素色块
                    if (anim.heroId && HERO_SPRITES[anim.heroId]) {
                        SpriteRenderer.drawProjectile(ctx, anim.sx, anim.sy, anim.tx, anim.ty, anim.heroId, progress);
                    } else {
                        const alpha = 1 - progress * 0.8;
                        const baseColor = anim.fromPlayer ? '#00aaee' : '#ee4444';
                        const critColor = anim.fromPlayer ? '#cc44ff' : '#ff44aa';

                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = anim.crit ? critColor : baseColor;
                        const ps = 8;
                        ctx.fillRect(Math.round(bx) - ps / 2, Math.round(by) - ps / 2, ps, ps);
                        ctx.restore();
                    }

                    return true;
                });
            }

            updateSynergies() {
                // 羁绊仅统计棋盘上的单位（备战席不触发羁绊）
                const allUnits = this.getBoardUnits();
                const synergyCounts = {};
                for (const s of Object.keys(SYNERGIES)) synergyCounts[s] = 0;
                const uniqueHeroes = new Set();
                for (const unit of allUnits) {
                    if (!unit || uniqueHeroes.has(unit.heroId)) continue;
                    uniqueHeroes.add(unit.heroId);
                    for (const s of unit.synergy) synergyCounts[s]++;
                }
                
                const activeSynergies = {};
                for (const [key, data] of Object.entries(SYNERGIES)) {
                    const count = synergyCounts[key];
                    let level = 0;
                    for (let i = data.tiers.length - 1; i >= 0; i--) {
                        if (count >= data.tiers[i]) {
                            level = data.tiers.length - i;
                            break;
                        }
                    }
                    activeSynergies[key] = { count, level, effect: level > 0 ? data.effects[level - 1] : null, data };
                }

                // 重置所有棋子的羁绊加成（但不覆盖法宝加成）
                for (const unit of allUnits) {
                    unit.damageReduction = 0;
                    unit.allStatsBoost = 0;
                    unit.trueDamageRate = 0;
                    unit.knightBlockRate = 0;
                    unit.healRate = 0;
                    unit.hasActiveSynergy = false;
                    // 先重算（应用星级 + 法宝），再叠加羁绊
                    unit.recalculateStats();
                }

                for (const [key, data] of Object.entries(activeSynergies)) {
                    if (data.level === 0) continue;
                    for (const unit of allUnits) {
                        if (unit.synergy.includes(key)) {
                            unit.hasActiveSynergy = true;
                            if (key === 'datang') {
                                const pctHp = data.level === 1 ? 0.15 : 0.30;
                                unit.maxHp = Math.floor(unit.maxHp * (1 + pctHp));
                                unit.hp = Math.floor(unit.hp * (1 + pctHp));
                            }
                            else if (key === 'huaguo') {
                                const crits = [0, 0.20, 0.40];
                                unit.critRate += crits[data.level] || 0;
                            }
                            else if (key === 'tianting') {
                                const armors = [0, 12, 28, 45];
                                const speeds = [0, 0.15, 0.30, 0.45];
                                unit.armor += armors[data.level] || 0;
                                unit.atkSpeed += speeds[data.level] || 0;
                            }
                            else if (key === 'xitian') {
                                const powers = [0, 30, 60];
                                unit.spellPower += powers[data.level] || 0;
                            }
                            else if (key === 'yaozu') {
                                const burns = [0, 0.10, 0.18, 0.28];
                                unit.burnRate = burns[data.level] || 0;
                            }
                            else if (key === 'longzu') {
                                unit.allStatsBoost += data.level === 1 ? 20 : 40;
                                // Re-apply allStatsBoost (since it affects maxHp and atk)
                                unit.maxHp = Math.floor(unit.maxHp * (1 + unit.allStatsBoost / 100));
                                unit.hp = Math.floor(unit.hp * (1 + unit.allStatsBoost / 100));
                                unit.atk = Math.floor(unit.atk * (1 + unit.allStatsBoost / 100));
                            }
                        }
                    }
                }

                this.renderSynergies(activeSynergies);
            }

            getBoardUnits() {
                const units = [];
                for (let r = 0; r < CONFIG.BOARD_HEIGHT; r++) {
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                        if (this.playerBoard[r][c]) units.push(this.playerBoard[r][c]);
                    }
                }
                return units;
            }

            normalizePlayerBoardToPlayerZone() {
                const units = this.getBoardUnits();
                this.playerBoard = Array(CONFIG.BOARD_HEIGHT).fill(null).map(() => Array(CONFIG.BOARD_WIDTH).fill(null));

                const placementQueue = [];
                for (const unit of units) {
                    if (!unit) continue;
                    const targetRow = Math.max(CONFIG.PLAYER_ZONE_START, Math.min(CONFIG.BOARD_HEIGHT - 1, unit.boardRow ?? CONFIG.BOARD_HEIGHT - 1));
                    const targetCol = Math.max(0, Math.min(CONFIG.BOARD_WIDTH - 1, unit.boardCol ?? 0));
                    placementQueue.push({ unit, row: targetRow, col: targetCol });
                }

                placementQueue.sort((a, b) => b.row - a.row || a.col - b.col);

                const overflow = [];
                for (const p of placementQueue) {
                    if (!this.playerBoard[p.row][p.col]) {
                        this.playerBoard[p.row][p.col] = p.unit;
                        p.unit.boardRow = p.row;
                        p.unit.boardCol = p.col;
                    } else {
                        overflow.push(p.unit);
                    }
                }

                for (const unit of overflow) {
                    let placed = false;
                    for (let r = CONFIG.BOARD_HEIGHT - 1; r >= CONFIG.PLAYER_ZONE_START && !placed; r--) {
                        for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                            if (!this.playerBoard[r][c]) {
                                this.playerBoard[r][c] = unit;
                                unit.boardRow = r;
                                unit.boardCol = c;
                                placed = true;
                                break;
                            }
                        }
                    }
                    if (!placed) {
                        const idx = this.getEmptyBenchSlot();
                        if (idx !== -1) {
                            this.playerBench[idx] = unit;
                            unit.boardRow = null;
                            unit.boardCol = null;
                        }
                    }
                }
            }

            capturePlayerFormation() {
                this.preCombatBoardSnapshot = [];
                for (let r = CONFIG.PLAYER_ZONE_START; r < CONFIG.BOARD_HEIGHT; r++) {
                    for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                        const unit = this.playerBoard[r][c];
                        if (unit) this.preCombatBoardSnapshot.push({ id: unit.id, row: r, col: c });
                    }
                }
            }

            restorePlayerFormation() {
                const units = this.getBoardUnits();
                this.playerBoard = Array(CONFIG.BOARD_HEIGHT).fill(null).map(() => Array(CONFIG.BOARD_WIDTH).fill(null));
                const byId = new Map(units.map(u => [u.id, u]));

                for (const slot of (this.preCombatBoardSnapshot || [])) {
                    const unit = byId.get(slot.id);
                    if (!unit) continue;
                    if (slot.row < CONFIG.PLAYER_ZONE_START || slot.row >= CONFIG.BOARD_HEIGHT) continue;
                    if (this.playerBoard[slot.row][slot.col]) continue;
                    this.playerBoard[slot.row][slot.col] = unit;
                    unit.boardRow = slot.row;
                    unit.boardCol = slot.col;
                    byId.delete(slot.id);
                }

                for (const unit of byId.values()) {
                    let placed = false;
                    for (let r = CONFIG.BOARD_HEIGHT - 1; r >= CONFIG.PLAYER_ZONE_START && !placed; r--) {
                        for (let c = 0; c < CONFIG.BOARD_WIDTH; c++) {
                            if (!this.playerBoard[r][c]) {
                                this.playerBoard[r][c] = unit;
                                unit.boardRow = r;
                                unit.boardCol = c;
                                placed = true;
                                break;
                            }
                        }
                    }
                }
            }

            resetCombatState(unit, fullHeal = true) {
                if (!unit) return;
                unit.isDead = false;
                unit.deathAlpha = 1;
                unit.deathTicks = 0;
                unit.attackCooldown = 0;
                unit.moveCooldown = 0;
                unit.lockedTargetId = null;
                unit.targetLockTicks = 0;
                unit.targetSwitchCooldown = 0;
                unit.hasAssassinJumped = false;
                unit.holdPositionTicks = 0;
                unit.lastAttackerId = null;
                unit.lastAttackerLockTicks = 0;
                unit.mana = 0;
                unit.animState = 'idle';
                unit.animTimer = 0;
                unit.animFrameIdx = 0;
                unit.animFrameTick = 0;
                unit.hitFlashTimer = 0;
                // 清除技能状态
                unit._skillStacks = 0;
                unit._bonusAtk = 0;
                unit._shieldActive = false;
                unit._slowStacks = 0;
                unit._voidMark = 0;
                unit._debuffCount = 0;
                unit._burnRate = 0;
                unit._burnTicks = 0;
                unit.damageReduction = 0;
                unit.trueDamageRate = 0;
                unit.knightBlockRate = 0;
                unit.healRate = 0;
                unit.burnRate = 0;
                unit.allStatsBoost = 0;
                unit.recalculateStats();
                if (fullHeal) unit.hp = unit.maxHp;
            }

            resetUnitsAfterBattle() {
                this.restorePlayerFormation();
                for (const unit of this.getBoardUnits()) this.resetCombatState(unit, true);
                for (const unit of this.playerBench) this.resetCombatState(unit, true);
                this.updateSynergies();
            }

            renderSynergies(synergies) {
                const list = document.getElementById('synergyList');
                list.innerHTML = '';
                
                const allSynergies = Object.entries(SYNERGIES).map(([key, data]) => {
                    const synData = synergies[key] || { count: 0, level: 0, effect: null };
                    return { key, ...data, ...synData };
                });
                
                allSynergies.sort((a, b) => (b.level > 0 ? 1 : 0) - (a.level > 0 ? 1 : 0) || b.count - a.count);
                
                for (const s of allSynergies) {
                    const item = document.createElement('div');
                    item.className = `synergy-item ${s.level > 0 ? 'active' : 'inactive'}`;
                    const iconHtml = s.asset
                        ? `<img class="synergy-icon-img" src="${s.asset}?v=${PNG_ASSET_VERSION}" alt="${s.name}">`
                        : s.icon;
                    
                    let pips = '';
                    for (let i = 0; i < s.tiers.length; i++) {
                        pips += `<div class="synergy-pip ${i < s.level ? 'active-' + s.level : ''}"></div>`;
                    }
                    
                    item.innerHTML = `
                        <div class="synergy-icon">${iconHtml}</div>
                        <div class="synergy-info">
                            <div class="synergy-name">${s.name}</div>
                            <div class="synergy-progress">${s.count}/${s.tiers[0]}</div>
                            ${s.effect ? `<div class="synergy-effect">${s.effect}</div>` : ''}
                        </div>
                        <div class="synergy-count">${s.count}</div>
                        <div class="synergy-level">${pips}</div>
                    `;
                    item.dataset.synergyKey = s.key;
                    item.addEventListener('mouseenter', (e) => this.showSynergyTooltip(e, s.key));
                    list.appendChild(item);
                }
            }

            calculateEnemySynergies() {
                const synergyCounts = {};
                for (const s of Object.keys(SYNERGIES)) synergyCounts[s] = 0;
                const uniqueHeroes = new Set();
                for (const enemy of this.enemies) {
                    if (!enemy || uniqueHeroes.has(enemy.heroId)) continue;
                    uniqueHeroes.add(enemy.heroId);
                    for (const s of enemy.synergy) synergyCounts[s]++;
                }
                
                const active = {};
                for (const [key, data] of Object.entries(SYNERGIES)) {
                    const count = synergyCounts[key];
                    let level = 0;
                    for (let i = data.tiers.length - 1; i >= 0; i--) {
                        if (count >= data.tiers[i]) {
                            level = data.tiers.length - i;
                            break;
                        }
                    }
                    if (level > 0) active[key] = { count, level, effect: data.effects[level - 1] };
                }
                return active;
            }

            renderEnemySynergyPreview() {
                const preview = document.getElementById('enemySynergyPreview');
                const list = document.getElementById('enemySynergyList');
                
                if (this.phase === 'combat' && this.enemies.length > 0) {
                    const synergies = this.calculateEnemySynergies();
                    if (Object.keys(synergies).length > 0) {
                        preview.style.display = 'block';
                        list.innerHTML = '';
                        for (const [key, data] of Object.entries(synergies)) {
                            const s = SYNERGIES[key];
                            list.innerHTML += `
                                <div class="enemy-synergy-item">
                                    <span>${s.icon} ${s.name} x${data.count}</span>
                                    <span style="color:#00ff88;margin-left:4px;">${data.effect}</span>
                                </div>
                            `;
                        }
                    } else {
                        preview.style.display = 'none';
                    }
                } else {
                    preview.style.display = 'none';
                }
            }

                // 连胜/连败徽章已移除，仅保留日志记录
            }

            pushRoundHistory(result, detail) {
                if (!this.roundHistory) this.roundHistory = [];
                this.roundHistory.unshift({ round: this.round, result, detail });
                if (this.roundHistory.length > 30) this.roundHistory.pop();
                this.renderRoundHistory();
                this.updateCounterRelationPanel();
            }

            renderRoundHistory() {
                const row = document.getElementById('roundHistoryRow');
                if (!row) return;
                if (!this.roundHistory || this.roundHistory.length === 0) {
                    row.innerHTML = '<span style="color:#667;">暂无战绩</span>';
                    return;
                }
                row.innerHTML = this.roundHistory.map(r => {
                    const isWin = String(r.result || '').includes('\u80dc');
                    const cls = isWin ? 'round-chip win' : 'round-chip lose';
                    const detail = (r.detail || '').replace(/"/g, '&quot;');
                    return `<span class="${cls}" title="${detail}">R${r.round} ${r.result}</span>`;
                }).join('');
