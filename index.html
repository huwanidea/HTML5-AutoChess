<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西游记自走棋 - 取经之路</title>
    <!-- 内联 SVG 图标，避免浏览器请求不存在的 favicon.ico 产生 404 -->

    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --px-bg-0: #0f0804;
            --px-bg-1: #1a1008;
            --px-panel: #2e1508;
            --px-panel-hi: #4a2210;
            --px-panel-lo: #1a0c04;

            --px-gold: #ffd700;
            --px-danger: #c83030;
            --px-border: #8B5E3C;
            --px-parchment: #e8d5a3;
            --ui-scene-bg: url('assets/ui/bg/scene_bg_far.png');

            --ui-top-bar: url('assets/ui/topbar/topbar_bg.png');

            --ui-bench-frame: url('assets/ui/bottom_panel/bottom_bar_bg.png');
            --ui-bench-slot: url('assets/ui/bottom_panel/bench_slot_empty.png');
            --ui-hero-card: url('assets/ui/bottom_panel/hero_card_bg.png');
            --ui-shop-card: url('assets/ui/right_panel/shop_item_bg.png');
            --ui-button-gold: url('assets/ui/buttons/btn_buy_exp.png');
            --ui-button-green: url('assets/ui/buttons/btn_refresh_shop.png');
            --ui-button-skip: url('assets/ui/buttons/btn_skip.png');
            --ui-shop-portrait-frame: url('assets/ui/right_panel/shop_portrait_frame.png');
            --ui-topbar-slot: url('assets/ui/topbar/topbar_slot_bg.png');
            --ui-topbar-divider: url('assets/ui/topbar/topbar_divider.png');
            --ui-synergy-row: url('assets/ui/left_panel/synergy_row_bg.png');
            --ui-dot-on: url('assets/ui/left_panel/dot_on.png');
            --ui-dot-off: url('assets/ui/left_panel/dot_off.png');
            --ui-scrollbar-track: url('assets/ui/right_panel/scrollbar_track.png');
            --ui-scrollbar-thumb: url('assets/ui/right_panel/scrollbar_thumb.png');
            --ui-tooltip-panel: url('assets/ui/panels/tooltip_panel_bg.png');
            --ui-modal-panel: url('assets/ui/panels/modal_panel_bg.png');
            --ui-coin-small: url('assets/ui/buttons/coin_small.png');
            --ui-icon-coin: url('assets/ui/topbar/icon_coin.png');
            --ui-icon-heart: url('assets/ui/topbar/icon_heart.png');
            --ui-icon-sword: url('assets/ui/topbar/icon_sword.png');
            --ui-icon-population: url('assets/ui/topbar/icon_population.png');
            --ui-icon-book: url('assets/ui/topbar/icon_book.png');
            --ui-icon-sound: url('assets/ui/topbar/icon_sound.png');
            --ui-icon-fullscreen: url('assets/ui/topbar/icon_fullscreen.png');
            --ui-icon-gear: url('assets/ui/topbar/icon_gear.png');
            --ui-icon-refresh: url('assets/ui/icons/icon_refresh.png');
            --ui-gen-difficulty-default: url('assets/ui/generated/difficulty_default.png');
            --ui-gen-difficulty-hover: url('assets/ui/generated/difficulty_hover.png');
            --ui-gen-difficulty-active: url('assets/ui/generated/difficulty_active.png');
            --ui-gen-top-skip-default: url('assets/ui/generated/top_skip_default.png');
            --ui-gen-top-skip-hover: url('assets/ui/generated/top_skip_hover.png');
            --ui-gen-top-skip-active: url('assets/ui/generated/top_skip_active.png');
            --ui-gen-top-speed-1-default: url('assets/ui/generated/top_speed_1_default.png');
            --ui-gen-top-speed-1-hover: url('assets/ui/generated/top_speed_1_hover.png');
            --ui-gen-top-speed-2-active: url('assets/ui/generated/top_speed_2_active.png');
            --ui-gen-top-sound-default: url('assets/ui/generated/top_sound_default.png');
            --ui-gen-top-sound-hover: url('assets/ui/generated/top_sound_hover.png');
            --ui-gen-top-sound-active: url('assets/ui/generated/top_sound_active.png');
            --ui-gen-top-settings-default: url('assets/ui/generated/top_settings_default.png');
            --ui-gen-top-settings-hover: url('assets/ui/generated/top_settings_hover.png');
            --ui-gen-top-settings-active: url('assets/ui/generated/top_settings_active.png');
            --ui-gen-top-fullscreen-default: url('assets/ui/generated/top_fullscreen_default.png');
            --ui-gen-top-fullscreen-hover: url('assets/ui/generated/top_fullscreen_hover.png');
            --ui-gen-top-fullscreen-active: url('assets/ui/generated/top_fullscreen_active.png');
            --ui-gen-button-buy-default: url('assets/ui/generated/button_buy_default.png');
            --ui-gen-button-buy-hover: url('assets/ui/generated/button_buy_hover.png');
            --ui-gen-button-buy-active: url('assets/ui/generated/button_buy_active.png');
            --ui-gen-button-buy-disabled: url('assets/ui/generated/button_buy_disabled.png');
            --ui-gen-button-refresh-default: url('assets/ui/generated/button_refresh_default.png');
            --ui-gen-button-refresh-hover: url('assets/ui/generated/button_refresh_hover.png');
            --ui-gen-button-refresh-active: url('assets/ui/generated/button_refresh_active.png');
            --ui-gen-button-refresh-disabled: url('assets/ui/generated/button_refresh_disabled.png');
            --ui-gen-button-reroll-default: url('assets/ui/generated/button_reroll_default.png');
            --ui-gen-button-reroll-hover: url('assets/ui/generated/button_reroll_hover.png');
            --ui-gen-button-reroll-active: url('assets/ui/generated/button_reroll_active.png');
            --ui-gen-button-reroll-disabled: url('assets/ui/generated/button_reroll_disabled.png');
            --ui-gen-counter-panel: url('assets/ui/generated/counter_relation_panel.png');
            --ui-gen-icon-draft-title: url('assets/ui/generated/icon_draft_title.png');
            --ui-gen-icon-gallery-title: url('assets/ui/generated/icon_gallery_title.png');
            --ui-gen-close-default: url('assets/ui/generated/close_default.png');
            --ui-gen-close-hover: url('assets/ui/generated/close_hover.png');
            --ui-gen-close-active: url('assets/ui/generated/close_active.png');
            --ui-gen-level-exp-panel: url('assets/ui/generated/level_exp_panel.png');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Noto Serif SC', 'SimSun', 'Microsoft YaHei', serif;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(120, 60, 10, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(80, 40, 5, 0.25) 0%, transparent 50%),
                linear-gradient(180deg, #0f0804 0%, #1a0c05 50%, #0f0804 100%),
                repeating-linear-gradient(
                    0deg,
                    rgba(139, 94, 60, 0.04) 0px,
                    rgba(139, 94, 60, 0.04) 1px,
                    transparent 1px,
                    transparent 6px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(139, 94, 60, 0.03) 0px,
                    rgba(139, 94, 60, 0.03) 1px,
                    transparent 1px,
                    transparent 6px
                ),
                #0f0804;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px;
            color: #c8a050;
            box-sizing: border-box;
            overflow: hidden;
            image-rendering: pixelated;
            letter-spacing: 0.3px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: calc(100vh - 16px);
        }

        body.fullscreen-mode {
            padding: 0;
        }

        body.fullscreen-mode .game-container {
            max-width: none;
            width: 100vw;
            max-height: 100vh;
            height: 100vh;
            gap: 4px;
        }

        body.fullscreen-mode .top-bar,
        body.fullscreen-mode .bottom-bar,
        body.fullscreen-mode .left-section,
        body.fullscreen-mode .right-section,
        body.fullscreen-mode .board-section {
            border-radius: 6px;
        }

        body.fullscreen-mode .left-section {
            width: 136px;
            padding: 6px 8px;
        }

        body.fullscreen-mode .right-section {
            width: 178px;
            padding: 6px 8px;
        }

        body.fullscreen-mode .shop-info { flex: 1; min-width: 0; }

        body.fullscreen-mode .shop-icon { font-size: 22px; margin-right: 6px; }

        body.fullscreen-mode .shop-name {
            font-size: 9px;
            margin-bottom: 1px;
        }

        body.fullscreen-mode .shop-stats { font-size: 8px; }
        body.fullscreen-mode .shop-synergy { font-size: 8px; }
        body.fullscreen-mode .shop-cost { font-size: 12px; }

        body.fullscreen-mode .bottom-bar {
            margin-top: 0;
            padding: 0;
            align-items: stretch;
            background: linear-gradient(180deg, rgba(80,50,10,0.15), rgba(30,15,5,0.25));
            border-top: 1px solid rgba(180,120,40,0.3);
        }

        body.fullscreen-mode .bench-section {
            min-width: 720px;
            height: 100%;
            margin: 0;
            padding: 6px 14px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background:
                radial-gradient(circle at 15% 20%, rgba(180,100,20,0.15), transparent 42%),
                radial-gradient(circle at 85% 75%, rgba(140,80,10,0.12), transparent 45%),
                rgba(20, 10, 4, 0.97);
            border-color: rgba(139,94,60,0.9);
        }

        body.fullscreen-mode .bench-slot {
            width: 60px;
            height: 74px;
        }

        body.fullscreen-mode .board-section {
            background:
                linear-gradient(135deg, rgba(50,25,5,0.3), rgba(25,12,3,0.15)),
                rgba(15, 8, 2, 0.96);
        }

        /* ===== 顶部状态栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, var(--px-panel-hi), var(--px-panel));
            border: 3px solid #000;
            box-shadow: inset 0 0 0 2px #8B5E3C, 0 0 0 2px #4a2208;
            border-radius: 0;
            padding: 8px 14px;
            flex-shrink: 0;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--px-gold);
            white-space: nowrap;
        }

        .top-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            opacity: 0.8;
            transition: opacity 0.15s;
        }
        .top-btn:hover { opacity: 1; }

        #fullscreenBtn {
            background: none;
            color: #fff;
            border: none;
            opacity: 1;
            font-weight: 800;
            box-shadow: none;
        }

        #fullscreenBtn:hover {
            transform: translateY(-1px);
            color: #ffffff;
            opacity: 1;
            background: none;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 6px;
        }
        .stat-icon { font-size: 14px; }
        .stat-value { font-size: 14px; font-weight: bold; }
        .stat-label { font-size: 10px; color: #888; }

        .top-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .phase-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: default;
        }
        .phase-badge.prep    { background: rgba(255,215,0,0.15); color: #ffd700; border: 1px solid rgba(255,215,0,0.4); }
        .phase-badge.draft  { background: rgba(0,180,255,0.15); color: #00bfff; border: 1px solid rgba(0,180,255,0.4); }
        .phase-badge.boss    { background: rgba(200,0,50,0.15); color: #ff4444; border: 1px solid rgba(200,0,50,0.4); }
        .phase-badge.combat  { background: rgba(180,80,20,0.2); color: #c8a050; border: 1px solid rgba(200,140,40,0.4); }

        .phase-timer {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            min-width: 28px;
            text-align: center;
        }
        .phase-timer.warning { color: #ff6600; }
        .phase-timer.danger  { color: #ff4444; animation: blink 0.3s infinite; }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .diff-btn {
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #3a4a6a;
            background: rgba(0,0,0,0.3);
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .diff-btn.active { background: rgba(255,215,0,0.15); color: #ffd700; border-color: #ffd700; }

        /* ===== 中间棋盘 ===== */
        .board-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            flex: 1;
            min-height: 0;
            margin-bottom: 2px;
        }

        .board-section {
            background: linear-gradient(180deg, var(--px-panel-hi), var(--px-panel));
            border: 3px solid #000;
            box-shadow: inset 0 0 0 2px #8B5E3C;
            border-radius: 0;
            padding: 8px;
            flex: 1;
            min-width: 0;
            position: relative;
        }

        body.fullscreen-mode .board-section {
            padding-top: 44px;
        }

        .board-container {
            position: relative;
            display: flex;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            border: 4px solid #8B5E3C;
            box-shadow: inset 0 0 0 2px #c8a050, 0 0 0 2px #4a2208;
            border-radius: 0;
            cursor: pointer;
            background: #0a0a15;
            image-rendering: pixelated;
        }

        .combat-overlay {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #00cc66;
            text-align: center;
            z-index: 10;
            display: none;
            pointer-events: none;
        }
        .combat-overlay.active { display: block; }

        .combat-overlay-rail {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            display: none;
            pointer-events: none;
        }

        body.fullscreen-mode .combat-overlay-rail.active {
            display: block;
        }

        body.fullscreen-mode .board-container .combat-overlay {
            display: none !important;
        }
        .combat-overlay-title { font-size: 12px; color: #ffd700; font-weight: bold; }
        .combat-overlay-timer { font-size: 16px; color: #c8a050; font-weight: bold; }

        .draft-overlay {
            background: rgba(20, 10, 2, 0.94);
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #c8a050;
            z-index: 15;
            display: none;
        }
        .draft-overlay.active { display: block; }
        .draft-title { font-size: 13px; color: #c8a050; font-weight: bold; margin-bottom: 3px; text-align: center; }
        .draft-instruction { font-size: 10px; color: #8B5E3C; margin-bottom: 8px; text-align: center; }
        .draft-actions { display: flex; justify-content: center; margin-top: 8px; }
        .btn-draft-refresh {
            background: #2e1508; color: #c8a050; border: 2px solid #8B5E3C;
            font-size: 11px; padding: 5px 14px; cursor: pointer;
        }
        .btn-draft-refresh:hover { background: #4a2210; border-color: #c8a050; }
        .btn-draft-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
        .draft-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .draft-option {
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8B5E3C;
            border-radius: 8px;
            cursor: pointer;
            min-width: 80px;
            transition: all 0.15s;
            text-align: center;
        }
        .draft-option:hover { border-color: #ffd700; background: rgba(255, 215, 0, 0.1); transform: scale(1.05); }
        .draft-option-icon { font-size: 26px; }
        .draft-option-name { font-size: 10px; color: #c8a050; margin-top: 3px; }
        .draft-option-cost { font-size: 9px; color: #ffd700; }

        /* ===== 底部工具栏 ===== */
        .bottom-bar {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            justify-content: center;
            margin-top: 0;
        }

        .bench-section {
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #3a4a6a;
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 560px;
        }

        .bench-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            color: #888;
        }

        .bench-grid {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .bench-slot {
            width: 56px;
            height: 68px;
            border: 2px dashed #5C3317;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .bench-slot:hover { border-color: #ffd700; background: rgba(255, 215, 0, 0.08); }
        .bench-slot.has-unit { border-style: solid; border-color: #8B5E3C; background: rgba(30, 15, 5, 0.9); }
        .bench-slot.drag-over { border-color: #c8a050; background: rgba(200, 160, 80, 0.15); transform: scale(1.06); }
        .bench-slot.mergeable { border-color: #ffd700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }

        .controls-section {
            background: rgba(20, 10, 2, 0.95);
            border: 2px solid #5C3317;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            min-width: 140px;
        }

        .btn {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { filter: brightness(1.2); transform: scale(1.02); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; transform: none; }
        .btn-buy    { background: rgba(255,215,0,0.2); color: #ffd700; border: 1px solid rgba(255,215,0,0.4); }
        .btn-refresh{ background: rgba(180,100,30,0.2); color: #c8a050; border: 1px solid rgba(200,130,40,0.4); }
        .btn-skip   { background: rgba(100,80,40,0.2); color: #b09060; border: 1px solid rgba(140,100,50,0.4); }
        .btn-skip.active { background: rgba(100,180,100,0.2); color: #a0cc88; border-color: rgba(100,200,100,0.4); }
        .btn-speed  { background: rgba(180,100,30,0.2); color: #c8a050; border: 1px solid rgba(200,130,40,0.4); font-size: 11px; padding: 4px 8px; }

        .left-section {
            background: rgba(20, 10, 2, 0.95);
            border: 2px solid #5C3317;
            border-radius: 10px;
            padding: 8px 10px;
            width: 170px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .right-section {
            background: rgba(20, 10, 2, 0.95);
            border: 2px solid #5C3317;
            border-radius: 10px;
            padding: 8px 10px;
            width: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .enemy-preview-title { font-size: 11px; color: #8B5E3C; margin-bottom: 3px; }
        .enemy-preview-info { font-size: 11px; color: #b09060; }

        .shop-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 6px;
        }
        .shop-section-header { font-size: 11px; color: #8B5E3C; margin-bottom: 4px; }

        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .synergy-section { font-size: 10px; color: #8B5E3C; }
        .log-section { font-size: 9px; color: #6B3A1A; flex: 1; min-height: 0; }

        .scrollbar-thin { overflow-y: auto; }
        .scrollbar-thin::-webkit-scrollbar { width: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #5C3317; border-radius: 2px; }

        .drag-preview {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 32px;
            background: rgba(20,10,2,0.8);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 4px 8px;
            display: none;
        }

        .game-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .game-overlay.active { display: flex; }
        .overlay-content {
            text-align: center;
            padding: 30px 50px;
            background: rgba(20, 10, 2, 0.98);
            border: 4px solid #c8a050;
        }
        .overlay-title { font-size: 28px; font-weight: bold; margin-bottom: 12px; }

        const SFX = (() => {
            let ctx = null;
            let muted = false;
            function getCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx;
            }
            function play(type, freq, duration, vol = 0.3) {
                if (muted) return;
                try {
                    const c = getCtx();
                    const osc = c.createOscillator();
                    const gain = c.createGain();
                    osc.connect(gain);
                    gain.connect(c.destination);
                    if (type === 'sine') osc.type = 'sine';
                    else if (type === 'square') osc.type = 'square';
                    else if (type === 'sawtooth') osc.type = 'sawtooth';
                    else osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, c.currentTime);
                    gain.gain.setValueAtTime(vol, c.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
                    osc.start(c.currentTime);
                    osc.stop(c.currentTime + duration);
                } catch (e) { /* ignore */ }
            }
            return {
                toggle() { muted = !muted; return muted; },
                isMuted() { return muted; },
                buy() { play('triangle', 660, 0.12, 0.2); setTimeout(() => play('triangle', 880, 0.12, 0.2), 100); },

        // 某个英雄的 PNG 精灵是否真正加载成功。
        // 注意：PNG_FILES 里登记了文件名不代表图片存在（文件可能缺失），

        function hasHeroSpritePng(heroId) {

        }

        // 从雪碧图提取单个帧的 canvas（自动检测网格）
        function extractPngFrame(img, col, row) {
            if (!img) return null;
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            // 自动检测帧尺寸（5x5 标准）
            const frameW = w / PNG_COLS;
            const frameH = h / PNG_ROWS;
            const c = document.createElement('canvas');
            c.width = PNG_FRAME_W;
            c.height = PNG_FRAME_H;
            // 这些帧后续会被 getImageData 读回（精灵诊断/像素统计），
            // 标记 willReadFrequently 避免 GPU 回读带来的性能警告与开销
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img,
                Math.round(col * frameW), Math.round(row * frameH), Math.round(frameW), Math.round(frameH),
                0, 0, PNG_FRAME_W, PNG_FRAME_H);
            return c;
        }

        // 构建单个英雄的 PNG 精灵帧缓存（state + facing 双层）
        function buildPngSpriteCacheForHero(heroId, img) {
            if (!img) return;

            const cfg = PNG_FRAMES_CONFIG[heroId] || PNG_DEFAULT_FRAME_CONFIG;
            const facingRows = cfg.facingRows || PNG_DEFAULT_FRAME_CONFIG.facingRows || PNG_FACING_ROWS;
            const stateRows = cfg.stateRows || PNG_DEFAULT_FRAME_CONFIG.stateRows || {};
            const cols = cfg.cols || PNG_DEFAULT_FRAME_CONFIG.cols;
            const facings = ['down', 'left', 'right', 'up'];
            const states = ['idle', 'walk', 'attack', 'skill', 'hit', 'dead'];

            const cache = {};
            for (const state of states) {
                cache[state] = {};
                const stateCols = cols[state] || cols.idle || [0];
                for (const facing of facings) {
                    // left 通过 PNG_RENDER_FACING_MAP 复用 right 行
                    const mappedFacing = PNG_RENDER_FACING_MAP[facing] || facing;
                    const rowByFacing = facingRows[mappedFacing] ?? facingRows.down ?? 0;
                    const row = stateRows[state] ?? rowByFacing;
                    cache[state][facing] = stateCols.map(col => extractPngFrame(img, col, row)).filter(Boolean);
                }
            }

            PNG_SPRITE_CACHE[heroId] = cache;
        }

        // 加载所有 PNG 精灵（并发）
        function loadAllPngSprites() {
            const promises = Object.entries(PNG_FILES).map(([heroId, filename]) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        PNG_SPRITE_IMAGES[heroId] = img;
                        buildPngSpriteCacheForHero(heroId, img);
                        resolve();
                    };
                    img.onerror = () => {
                        console.warn(`[Sprite] ${filename} 加载失败，将使用程序像素精灵`);
                        resolve();
                    };
                    img.src = getPngAssetUrl(filename);
                });
            });
            return Promise.all(promises);
        }

        // 精灵数据扩展器：将低分辨率帧转换为高分辨率帧
        function expandSpriteFrame(frame, scale) {
            const hiFrame = [];
            for (let row = 0; row < frame.length; row++) {
                const hiRow = [];
                const charRow = frame[row];
                for (let col = 0; col < charRow.length; col++) {
                    const ch = charRow[col];
                    // 每个像素扩展为 scale x scale 个像素（水平扩展）
                    for (let s = 0; s < scale; s++) {
                        hiRow.push(ch);
                    }
                }
                // 复制行（垂直方向也扩展）- scale 次
                for (let s = 0; s < scale; s++) {
                    hiFrame.push([...hiRow]);
                }
            }
            return hiFrame;
        }

        // ============================================================
        // 像素人物精灵渲染器
        // ============================================================
        class SpriteRenderer {
            // 绘制高分辨率像素人物
            // ctx, heroId, animState, frameIdx, facing, cx, cy, pixelSize, isEnemy, starLevel, flashColor
            static draw(ctx, heroId, animState, frameIdx, facing, cx, cy, pixelSize, isEnemy, starLevel, flashColor) {
                // 初始化高分辨率精灵数据（如果尚未初始化）
                initHiResSprites();

                // 诊断：首次绘制时记录
                if (!SpriteRenderer._drawnHeroes) SpriteRenderer._drawnHeroes = new Set();
                if (!SpriteRenderer._drawnHeroes.has(heroId + ':' + animState)) {
                    SpriteRenderer._drawnHeroes.add(heroId + ':' + animState);
                }

                // ── PNG 精灵图优先绘制 ──
                // PNG: 5行×5列（用户自定义）
                const pngCache = PNG_SPRITE_CACHE[heroId];
                if (pngCache) {
                    const frameCfg = PNG_FRAMES_CONFIG[heroId] || PNG_DEFAULT_FRAME_CONFIG;
                    const stateRows = frameCfg.stateRows || {};
                    const isFixedRow = stateRows[animState] !== undefined;
                    const safeFacing = (facing && ['down', 'left', 'right', 'up'].includes(facing)) ? facing : 'down';
                    const rawFacing = isFixedRow ? 'down' : (PNG_RENDER_FACING_MAP[safeFacing] || 'down');
                    const flipX = !isFixedRow && safeFacing === 'left';
                    const stateMap = pngCache[animState] || pngCache.idle;
                    const pngFrames = stateMap?.[rawFacing] || stateMap?.down || [];
                    if (pngFrames.length > 0) {
                        const frame = pngFrames[frameIdx % pngFrames.length];
                        if (frame) {
                            ctx.save();
                            ctx.imageSmoothingEnabled = false;
                            ctx.translate(cx, cy);

                            // left 方向通过 right 帧进行水平翻转复用
                            if (flipX) {
                                ctx.scale(-1, 1);
                            }

                            // 缩放交给棋盘/备战席的 size 控制，保留星级带来的体型差异。
                            const targetHeight = Math.max(56, Math.min(116, pixelSize * 10.8));
                            const scale = targetHeight / PNG_FRAME_H;

                            ctx.scale(scale, scale);

                            ctx.drawImage(frame, -frame.width / 2, -frame.height / 2);

                            // 敌方整体偏红叠加
                            if (isEnemy) {
                                ctx.globalCompositeOperation = 'source-atop';
                                ctx.globalAlpha = PNG_OVERLAY.enemyTintAlpha;
                                ctx.fillStyle = PNG_OVERLAY.enemyTintColor;
                                ctx.fillRect(-PNG_FRAME_W / 2, -PNG_FRAME_H / 2, PNG_FRAME_W, PNG_FRAME_H);
                                ctx.globalCompositeOperation = 'source-over';
                                ctx.globalAlpha = 1;
                            }

                            // hit 状态：叠加红色闪烁
                            if (animState === 'hit') {
                                ctx.globalCompositeOperation = 'source-atop';
                                ctx.globalAlpha = PNG_OVERLAY.hitAlpha;
                                ctx.fillStyle = PNG_OVERLAY.hitColor;
                                ctx.fillRect(-PNG_FRAME_W / 2, -PNG_FRAME_H / 2, PNG_FRAME_W, PNG_FRAME_H);
                                ctx.globalCompositeOperation = 'source-over';
                                ctx.globalAlpha = 1;
                            }

                            // dead 状态：叠加灰暗色
                            if (animState === 'dead') {
                                ctx.globalCompositeOperation = 'source-atop';
                                ctx.globalAlpha = PNG_OVERLAY.deadAlpha;
                                ctx.fillStyle = PNG_OVERLAY.deadColor;
                                ctx.fillRect(-PNG_FRAME_W / 2, -PNG_FRAME_H / 2, PNG_FRAME_W, PNG_FRAME_H);
                                ctx.globalCompositeOperation = 'source-over';
                                ctx.globalAlpha = 1;
                            }

                            ctx.restore();
                            return true;
                        }
                    }
                }

                const data = HI_RES_SPRITES[heroId];
                if (!data) return false;

                // 从高分辨率精灵数据获取帧
                const stateFrames = data[animState] || (animState === 'skill' ? data.attack : null) || data.idle;
                if (!stateFrames || stateFrames.length === 0) return false;

                const useHit = animState === 'hit' && (!data.hit || data.hit.length === 0);
                const frame = stateFrames[frameIdx % stateFrames.length];
                const W = HI_RES_SIZE;  // 22
                const H = HI_RES_SIZE;  // 22
                
                // 高分辨率：每个像素块缩小为原来的 HI_RES_SCALE 分之一
                const hiPixelSize = pixelSize / HI_RES_SCALE;  // 6/2 = 3

                ctx.save();
                ctx.imageSmoothingEnabled = false;
                ctx.translate(cx, cy);

                // 逐像素绘制（高分辨率）
                for (let row = 0; row < H; row++) {
                    for (let col = 0; col < W; col++) {
                        const key = frame[row][col];
                        if (key === '.' || key === ' ') continue;

                        // 从全局调色板取色
                        let color = SPRITE_PALETTE[key];
                        if (!color) color = SPRITE_PALETTE['B'];

                        const px = (col - W / 2) * hiPixelSize;
                        const py = (row - H / 2) * hiPixelSize;

                        // 受击闪白
                        if (useHit && color !== SPRITE_PALETTE['.']) {
                            ctx.fillStyle = '#ff3333';
                        } else if (flashColor) {
                            ctx.fillStyle = flashColor;
                        } else {
                            ctx.fillStyle = color;
                        }
                        ctx.fillRect(px, py, hiPixelSize, hiPixelSize);

                        // 高光（H键 = 皮肤/白色高光）
                        if (key === 'H') {
                            ctx.fillStyle = 'rgba(255,255,255,0.4)';
                            ctx.fillRect(px, py, hiPixelSize * 0.45, hiPixelSize * 0.45);
                        }
                    }
                }

                // 敌方整体偏红叠加
                if (isEnemy) {
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.globalAlpha = 0.1;
                    ctx.fillStyle = '#ff2020';
                    ctx.fillRect(-W * hiPixelSize / 2, -H * hiPixelSize / 2, W * hiPixelSize, H * hiPixelSize);
                    ctx.globalCompositeOperation = 'source-over';
                }

                ctx.restore();
                return true;
            }

            // 绘制投射物（弓箭/魔法球）
            static drawProjectile(ctx, sx, sy, tx, ty, heroId, progress) {
                const data = HERO_SPRITES[heroId];
                const role = data ? data.role : {};
                const projColor = role.accent || '#ffffff';
                const bounce = Math.sin(progress * Math.PI) * 8;
                const px = sx + (tx - sx) * progress;
                const py = sy + (ty - sy) * progress - bounce;
                const r = 4;

                ctx.save();
                ctx.fillStyle = projColor;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();

                // 光晕
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px, py, r + 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 绘制英雄头像（用于商店卡牌/仓库卡牌/拖拽预览）
            // 使用 PNG 精灵第一帧，fallback 到 emoji
            static drawHeroIcon(ctx, heroId, cx, cy, size, starLevel = 1) {
                // 优先尝试 PNG 精灵
                const pngCache = PNG_SPRITE_CACHE[heroId];
                if (pngCache) {
                    const pngFrames = pngCache.idle?.down || pngCache.idle?.right || [];
                    if (pngFrames.length > 0) {
                        const frame = pngFrames[0];
                        if (frame) {
                            ctx.save();
                            ctx.imageSmoothingEnabled = false;
                            ctx.translate(cx, cy);

                            // 2星以上发光底
                            if (starLevel >= 2) {
                                ctx.globalAlpha = starLevel === 3 ? 0.22 : 0.12;
                                ctx.fillStyle = '#44ddff';
                                ctx.beginPath();
                                ctx.arc(0, 0, size * 0.55, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.globalAlpha = 1;
                            }

                            // PNG 64px 缩放到目标 size
                            const scale = size / PNG_FRAME_H;
                            ctx.scale(scale, scale);
                            ctx.drawImage(frame, -frame.width / 2, -frame.height / 2);
                            ctx.restore();
                            return true;
                        }
                    }
                }
                // Fallback: 像素画或 emoji（PNG未加载或无可用帧）
                console.warn('[drawHeroIcon] ' + heroId + ' 无PNG缓存，使用像素精灵');
                return SpriteRenderer._drawHeroIconFallback(ctx, heroId, cx, cy, size, starLevel);
            }

            // 像素画 / emoji 回退绘制（用于 PNG 加载失败时）
            static _drawHeroIconFallback(ctx, heroId, cx, cy, size, starLevel) {
                const pixelSize = Math.max(2, Math.floor(size / 14));
                const spriteData = HERO_SPRITES[heroId];
                if (spriteData && spriteData.idle && spriteData.idle[0]) {
                    // 像素画渲染
                    const rows = spriteData.idle[0].length;
                    const cols = spriteData.idle[0][0].length;
                    const scaleX = size / (cols * pixelSize);
                    const scaleY = size / (rows * pixelSize);
                    const scale = Math.min(scaleX, scaleY) * 0.9;
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    ctx.translate(cx - (cols * pixelSize * scale) / 2, cy - (rows * pixelSize * scale) / 2);
                    ctx.scale(scale, scale);
                    const role = spriteData.role || {};
                    const colorMap = {
                        'B': '#555', 'W': '#eee', 'G': role.accent || '#8B6914',
                        'R': '#c0392b', 'Y': '#f39c12', 'O': '#e67e22',
                        'P': '#8e44ad', 'K': '#1a1a1a', 'S': '#D2B48C',
                        'H': '#f1c40f', 'L': '#2ecc71', 'N': '#3498db',
                    };
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const ch = spriteData.idle[0][r][c];
                            if (ch && ch !== '.' && colorMap[ch]) {
                                ctx.fillStyle = colorMap[ch];
                                ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
                            }
                        }
                    }
                    ctx.restore();
                    return true;
                }
                // 最终回退: emoji
                const heroData = HEROES[heroId];
                if (heroData && heroData.icon) {
                    ctx.save();
                    ctx.font = `${Math.floor(size * 0.92)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(heroData.icon, cx, cy);
                    ctx.restore();
                    return true;
                }
                return false;
            }
        }

        const SYNERGIES = {
            datang:   { name: '大唐', icon: '🐎', asset: 'assets/ui/left_panel/icon_race_datang.png', tiers: [2, 4], effects: ['生命+15%', '生命+30%'] },
            huaguo:   { name: '花果山', icon: '🐒', asset: 'assets/ui/left_panel/icon_race_huaguoshan.png', tiers: [2, 4], effects: ['暴击+20%', '暴击+40%'] },
            tianting: { name: '天庭', icon: '☁️', asset: 'assets/ui/left_panel/icon_race_tianting.png', tiers: [2, 4, 6], effects: ['护甲+12,攻速+15%', '护甲+28,攻速+30%', '护甲+45,攻速+45%'] },
            xitian:   { name: '西天', icon: '📿', asset: 'assets/ui/left_panel/icon_race_xitian.png', tiers: [2, 3], effects: ['法强+30%', '法强+60%'] },
            yaozu:    { name: '妖族', icon: '🦊', asset: 'assets/ui/left_panel/icon_race_yaozu.png', tiers: [2, 4, 6], effects: ['3秒烧10%', '3秒烧18%', '3秒烧28%'] },
            longzu:   { name: '龙族', icon: '🐉', asset: 'assets/ui/left_panel/icon_race_longzu.png', tiers: [2, 3], effects: ['全属性+20%', '全属性+40%'] }
        };
class Unit {
            constructor(heroData, starLevel = 1, isPlayer = true) {
                this.id = heroData.id + '_' + Date.now() + '_' + Math.random();
                this.heroId = heroData.id;
                this.name = heroData.name;
                this.icon = heroData.icon;
                this.baseHp = heroData.hp;
                this.baseAtk = heroData.atk;
                this.synergy = [...heroData.synergy];
                this.cost = heroData.cost;
                this.tier = heroData.tier;
                this.starLevel = starLevel;
                this.isPlayer = isPlayer;
                this.game = null; // 将在购买/放置时注入引用
                this.hp = this.baseHp;
                this.maxHp = this.baseHp;
                this.atk = this.baseAtk;
                this._baseAtk = this.baseAtk;
                this.armor = 0;
                this.atkSpeed = 1.0;
                this.critRate = 0;
                this.damageReduction = 0;
                this.healRate = 0;
                this.trueDamageRate = 0;
                this.allStatsBoost = 0;
                this.attackCooldown = 0;
                this.maxCooldown = 20;
                this.range = heroData.range || this._inferAttackRange();
                this.minRange = heroData.minRange || this._inferMinAttackRange();
                this.moveCooldown = 0;
                this.lockedTargetId = null;
                this.targetLockTicks = 0;
                this.targetSwitchCooldown = 0;
                this.hasAssassinJumped = false;
                this.holdPositionTicks = 0;
                this.lastAttackerId = null;
                this.lastAttackerLockTicks = 0;
                this.boardRow = null;
                this.boardCol = null;
                // 动画状态（逻辑坐标与视觉坐标分离）
                this.visualX = 0;       // 当前视觉像素X
                this.visualY = 0;       // 当前视觉像素Y
                this.targetX = 0;       // 目标X（每次移动/攻击目标）
                this.targetY = 0;       // 目标Y
                this.animState = 'idle'; // idle | walk | attack | skill | hit | dead
                this.facing = this.isPlayer ? 'up' : 'down'; // down | left | right | up
                this.animTimer = 0;      // 动画已持续tick数
                this.animFrameIdx = 0;   // 当前动画帧索引（用于 PNG 精灵循环）
                this.animFrameTick = 0;  // 当前帧已持续的 tick 数
                this.floatPhase = Math.random() * Math.PI * 2; // 呼吸相位（错开）
                this.hitFlashTimer = 0;  // 受击红闪计时
                this.shakeX = 0;         // 受击横向抖动
                this.deathAlpha = 1;     // 死亡透明度
                this.deathTicks = 0;
                this.isDead = false;
                this.healFlash = 0;
                this.hasActiveSynergy = false;
                this.items = [];
                this._baseArmor = 0; this._baseMr = 0; this._baseCrit = 0;
                this._baseAtkSpeed = 1.0;
                const skillMeta = this._inferHeroSkill();
                this.skillName = skillMeta.name;
                this.skillDesc = skillMeta.desc;
                this.maxMana = skillMeta.mana;
                this.mana = 0;
                this.manaGainOnAttack = 35;

                this.zoneBonus = null; // 布阵后由 Game 类设置
                this.itemCallback = null;
                this.recalculateStats();
            }

            _inferAttackRange() {
                const rangedHeroes = new Set([
                    'archer2', 'mage1', 'mage2', 'healer1', 'assassin2',
                    'huangfengguai', 'honghaier', 'mage_yinjiao',
                    'epic_mage', 'dragon1', 'knight2', 'donghailongwang',
                    'epic_healer', 'legendary2'
                ]);
                const midRangeHeroes = new Set(['huaguo_houjiang', 'liuer_mihou']);
                if (rangedHeroes.has(this.heroId)) return 3;
                if (midRangeHeroes.has(this.heroId)) return 2;
                return 1;
            }

            _inferMinAttackRange() {
                if (this._inferAttackRange() >= 3) return 2;
                return 1;
            }

            _inferHeroSkill() {
                const map = {
                    warrior1: { name: '流沙护行', desc: '获得减伤并提升少量护甲', mana: 80 },
                    huaguo_houjiang: { name: '棍影连击', desc: '提高暴击并追加一次短打', mana: 75 },

                    healer1: { name: '龙息回春', desc: '回复自身12%最大生命', mana: 90 },
                    tank1: { name: '乾坤圈', desc: '提升8%伤害减免', mana: 80 },

                    tongbiyuanhou: { name: '通臂重击', desc: '对目标造成强力额外伤害', mana: 80 },
                    assassin2: { name: '水府咒浪', desc: '法力充满后追加水系法术伤害', mana: 85 },
                    assassin1: { name: '天眼斩', desc: '提高暴击并附加额外伤害', mana: 75 },
                    knight1: { name: '牛魔冲撞', desc: '提升护体减伤并重击目标', mana: 80 },
                    honghaier: { name: '三昧真火', desc: '追加火焰法术伤害', mana: 75 },
                    assassin_jinjiao: { name: '紫金葫芦', desc: '对低生命目标追加伤害', mana: 80 },
                    mage_yinjiao: { name: '玉净瓶光', desc: '法力充满后追加法术伤害', mana: 80 },
                    liuer_mihou: { name: '假身突袭', desc: '提高暴击并施加受伤标记', mana: 70 },
                    epic_mage: { name: '紧箍佛光', desc: '回复自身并获得西天法力加成', mana: 85 },
                    dragon1: { name: '甘露普渡', desc: '回复自身22%最大生命', mana: 85 },
                    knight2: { name: '袖里乾坤', desc: '降低敌人攻速15%，可叠3层', mana: 80 },
                    donghailongwang: { name: '沧海潮生', desc: '追加水系法术伤害', mana: 80 },
                    epic_healer: { name: '芭蕉风卷', desc: '追加法术伤害并削弱目标攻速', mana: 80 },
                    legendary1: { name: '如意金箍', desc: '提高暴击并标记目标受伤增加', mana: 70 },
                    legendary2: { name: '佛掌镇压', desc: '自身全属性+10%', mana: 70 }
                };
                return map[this.heroId] || { name: '普通攻击', desc: '无特殊主动技能', mana: 100 };
            }

            applyBurn(rate, durationTicks) {
                this._burnRate = rate;
                this._burnTicks = durationTicks;
            }

            tickBurn(dt = 1) {
                if (this._burnTicks > 0) {
                    const step = Math.min(dt, this._burnTicks);
                    this._burnTicks -= step;
                    const dmgPerTick = (this.maxHp * this._burnRate) / 30 * step;
                    this.hp -= dmgPerTick;
                    if (this.hp <= 0 && !this.isDead) {
                        this.hp = 0;
                        this.die();
                    }
                    if (this.game && Math.random() < 0.2) {
                        const p = this.game.getCellCenter(this.boardRow, this.boardCol);
                        this.game.addFloatDamage(p.x, p.y, Math.ceil(dmgPerTick), 'true');
                    }
                }
            }

            recalculateStats() {
                const multipliers = { 1: 1, 2: 1.8, 3: 3.24 };
                const mult = multipliers[this.starLevel] || 1;
                const boost = 1 + (this.allStatsBoost / 100);
                this.maxHp = Math.floor(this.baseHp * mult * boost);
                this.hp = Math.min(this.hp, this.maxHp);
                this.atk = Math.floor(this.baseAtk * mult * boost);
                this.spellPower = 0; this.critDmg = 150; this.reflect = 0;
                this._baseArmor = 0; this._baseMr = 0; this._baseCrit = 0; this._baseAtkSpeed = 1.0;
                if (this.items) {
                    for (const item of this.items) {
                        if (item.atk) this.atk += item.atk;
                        if (item.hp) this.maxHp += item.hp;
                        if (item.armor) this._baseArmor += item.armor;
                        if (item.mr) this._baseMr += item.mr;
                        if (item.crit) this._baseCrit += item.crit / 100;
                        if (item.atkSpeed) this._baseAtkSpeed += item.atkSpeed;
                        if (item.spellPower) this.spellPower += item.spellPower;
                        if (item.critDmg) this.critDmg += item.critDmg;
                        if (item.reflect) this.reflect += item.reflect;
                    }
                    this._tryCombineItems();
                }
                this.armor = this._baseArmor;
                this.mr = this._baseMr;
                this.critRate = this._baseCrit;
                this.atkSpeed = this._baseAtkSpeed;
                this.hp = Math.min(this.hp, this.maxHp);
                //阵法加成在 base stat 基础上叠加（由 _applyZoneBonus 调用）
                this._applyZoneBonus();
            }

            // 阵法站位加成（根据行数）
            // 行4: 前排坦克  护甲+20, 减伤+10%
            // 行5-6: 中排输出  攻击+15, 暴击+10%
            // 行7: 后排DPS   攻速+25%, 法术强度+20
            _applyZoneBonus() {
                const starMult = { 1: 1, 2: 1.8, 3: 3.24 }[this.starLevel] || 1;
                const boost = 1 + (this.allStatsBoost || 0) / 100;
                const baseArmor = this._baseArmor || 0;
                this.armor = baseArmor + (this.zoneBonus === 'tank' ? 20 : 0);
                this.damageReduction = this.zoneBonus === 'tank' ? 10 : 0;
                this.atk = Math.floor(this.baseAtk * starMult * boost) + (this.zoneBonus === 'warrior' ? Math.floor(this.baseAtk * 0.15) : 0);
                this.critRate = (this._baseCrit || 0) + (this.zoneBonus === 'warrior' ? 0.10 : 0);
                this.atkSpeed = this._baseAtkSpeed + (this.zoneBonus === 'dps' ? 0.25 : 0);
                this.spellPower = (this.spellPower || 0) + (this.zoneBonus === 'dps' ? 20 : 0);
            }

            // 更新动画状态（每帧调用）
            tickAnim(dt) {
                const now = Date.now();
                this.floatOffset = Math.sin(now / 600 + this.floatPhase) * 2.5;

                if (this.hitFlashTimer > 0) this.hitFlashTimer = Math.max(0, this.hitFlashTimer - dt);
                if (this.animTimer > 0) this.animTimer = Math.max(0, this.animTimer - dt);
                if (this.isDead) {
                    this.animState = 'dead';
                    this.deathTicks += dt;
                }

                const pngCache = PNG_SPRITE_CACHE[this.heroId];
                if (pngCache) {
                    this.animFrameTick += dt;
                    const frameTickDuration =
                        this.animState === 'dead' ? 6 :
                        this.animState === 'attack' || this.animState === 'skill' ? 4 :
                        this.animState === 'hit' ? 5 : 8;
                    if (this.animFrameTick >= frameTickDuration) {
                        this.animFrameTick = 0;
                        const frameCfg = PNG_FRAMES_CONFIG[this.heroId] || PNG_DEFAULT_FRAME_CONFIG;
                        const stateRows = frameCfg.stateRows || {};
                        const isFixedRow = stateRows[this.animState] !== undefined;
                        const effectiveFacing = isFixedRow ? 'down' : this.facing;
                        const stateMap = pngCache[this.animState] || pngCache.idle || {};
                        const frames = stateMap[effectiveFacing] || stateMap.down || [];
                        const nonLooping = ['attack', 'skill', 'hit', 'dead'].includes(this.animState);
                        const maxFrame = Math.max(0, frames.length - 1);
                        this.animFrameIdx = nonLooping
                            ? Math.min(this.animFrameIdx + 1, maxFrame)
                            : (this.animFrameIdx + 1) % Math.max(1, frames.length);
                    }
                }

                if (!this.isDead && ['attack', 'skill', 'hit', 'walk'].includes(this.animState) && this.animTimer <= 0) {
                    this.animState = 'idle';
                    this.animFrameIdx = 0;
                    this.animFrameTick = 0;
                }

                if (this.isDead && this.deathTicks > CONFIG.DEATH_FADE_DELAY_TICKS && this.deathAlpha > 0.3) {
                    this.deathAlpha = Math.max(0.3, this.deathAlpha - 0.025 * dt);
                }
            }

            // 触发生存步移动画
            triggerWalk(fromRow, fromCol, toRow, toCol, cellSize, isPlayer) {
                if (this.isDead) return;
                const dr = toRow - fromRow;
                const dc = toCol - fromCol;
                if (Math.abs(dc) >= Math.abs(dr) && dc !== 0) {
                    this.facing = dc > 0 ? 'right' : 'left';
                } else if (dr !== 0) {
                    this.facing = dr > 0 ? 'down' : 'up';
                }

                this.animState = 'walk';
                this.animTimer = 20;
                this.animFrameIdx = 0;
                this.animFrameTick = 0;
                this.floatPhase = Math.random() * Math.PI * 2;
            }

            // 触发攻击动画
            triggerAttack(target) {
                if (this.isDead) return;
                if (target) {
                    const dr = target.boardRow - this.boardRow;
                    const dc = target.boardCol - this.boardCol;
                    if (Math.abs(dc) >= Math.abs(dr) && dc !== 0) {
                        this.facing = dc > 0 ? 'right' : 'left';
                    } else if (dr !== 0) {
                        this.facing = dr > 0 ? 'down' : 'up';
                    }
                }

                this.animState = 'attack';
                this.animTimer = CONFIG.ATTACK_ANIM_TICKS;
                this.animFrameIdx = 0;
                this.animFrameTick = 0;
            }

            triggerSkill(target) {
                if (this.isDead) return;
                if (target) {
                    const dr = target.boardRow - this.boardRow;
                    const dc = target.boardCol - this.boardCol;
                    if (Math.abs(dc) >= Math.abs(dr) && dc !== 0) {
                        this.facing = dc > 0 ? 'right' : 'left';
                    } else if (dr !== 0) {
                        this.facing = dr > 0 ? 'down' : 'up';
                    }
                }

                this.animState = 'skill';
                this.animTimer = CONFIG.SKILL_ANIM_TICKS;
                this.animFrameIdx = 0;
                this.animFrameTick = 0;
            }

            // 触发受击动画
            triggerHit() {
                if (this.isDead) return;
                this.animState = 'hit';
                this.animTimer = CONFIG.HIT_ANIM_TICKS;
                this.animFrameIdx = 0;
                this.animFrameTick = 0;
                this.hitFlashTimer = CONFIG.HIT_ANIM_TICKS;
            }

            die() {
                if (this.isDead) return;
                this.hp = 0;
                this.isDead = true;
                this.animState = 'dead';
                this.animTimer = CONFIG.DEATH_ANIM_TICKS;
                this.animFrameIdx = 0;
                this.animFrameTick = 0;
                this.hitFlashTimer = 0;
                this.deathAlpha = 1;
                this.deathTicks = 0;
                this.attackCooldown = 999;
                this.lockedTargetId = null;
                this.targetLockTicks = 0;
                this.targetSwitchCooldown = 0;
                this.lastAttackerId = null;
                this.lastAttackerLockTicks = 0;
                this.mana = 0;
            }

            // 自动检测可合成的法宝配方
            _tryCombineItems() {
                if (!this.items || this.items.length < 2) return;
                for (let i = 0; i < this.items.length; i++) {
                    for (let j = i + 1; j < this.items.length; j++) {
                        const a = this.items[i], b = this.items[j];
                        const combo = COMBINATIONS.find(c =>
                            (c.a === a.id && c.b === b.id) || (c.a === b.id && c.b === a.id)
                        );
                        if (combo) {
                            const oldA = a.icon + ' ' + a.name;
                            const oldB = b.icon + ' ' + b.name;
                            const newItem = { ...combo };
                            this.items.splice(j, 1);
                            this.items.splice(i, 1, newItem);
                            if (this.itemCallback) this.itemCallback(this.name, oldA, oldB, newItem.icon + ' ' + newItem.name);
                            return;
                        }
                    }
                }
            }

            // 计算护甲减伤比例
            getArmorReduction() {
                return this.armor / (this.armor + 100);
            }

            // 计算对目标造成的最终伤害（含护甲减伤与特殊真实伤害）
            calcFinalDamage(damage, attackingUnit) {
                let finalDamage = damage;
                const trueDamageRate = attackingUnit ? (attackingUnit.trueDamageRate || 0) : 0;
                const truePart = finalDamage * trueDamageRate;
                const normalPart = finalDamage * (1 - trueDamageRate) * (1 - this.getArmorReduction());
                return normalPart + truePart;
            }

            takeDamage(damage, attackingUnit) {
                if (this.isDead) return 0;
                // 格挡类被动
                if (this.knightBlockRate > 0 && Math.random() < this.knightBlockRate) {
                    return 0;
                }
                // 庇护类被动：抵挡一次致命伤害
                if (this._shieldActive && damage >= this.hp) {
                    this._shieldActive = false;
                    return 0;
                }
                if (attackingUnit && !attackingUnit.isDead) {
                    this.lastAttackerId = attackingUnit.id;
                    this.lastAttackerLockTicks = 18;
                }
                this.mana = Math.min(this.maxMana || 100, (this.mana || 0) + this.manaGainOnHit);
                // 特殊标记增伤
                let finalDmg = damage;
                if (this._voidMark > 0) {
                    finalDmg *= (1 + this._voidMark);
                }

                // --- 西游同盟克制机制 ---
                if (attackingUnit) {
                    let multiplier = 1.0;
                    const aSyn = attackingUnit.synergy || [];
                    const dSyn = this.synergy || [];
                    // 增伤逻辑 (attacker vs defender)
                    if (aSyn.includes('xitian') && dSyn.includes('datang')) multiplier += 0.20;
                    if (aSyn.includes('huaguo') && dSyn.includes('tianting')) multiplier += 0.15;
                    if (aSyn.includes('yaozu') && dSyn.includes('longzu')) multiplier += 0.25;
                    // 减伤逻辑 (defender vs attacker)
                    if (dSyn.includes('tianting') && aSyn.includes('huaguo')) multiplier -= 0.15;
                    if (dSyn.includes('yaozu') && aSyn.includes('tianting')) multiplier -= 0.20;
                    if (dSyn.includes('longzu') && aSyn.includes('huaguo')) multiplier -= 0.15;
                    if (dSyn.includes('datang') && aSyn.includes('xitian')) multiplier -= 0.15;
                    finalDmg *= Math.max(0.1, multiplier);
                }

                const reducedDamage = finalDmg * (1 - this.damageReduction / 100);
                const actualDamage = this.calcFinalDamage(reducedDamage, attackingUnit);
                this.hp -= actualDamage;
                // 反震宝甲反伤
                if (this.reflect > 0 && attackingUnit && attackingUnit.hp > 0) {
                    attackingUnit.hp -= actualDamage * this.reflect / 100;
                    if (attackingUnit.hp <= 0) attackingUnit.die();
                }
                if (this.hp <= 0) {
                    this.die();
                }
                return actualDamage;
            }

            heal(amount) {
                if (this.isDead) return 0;
                const healed = Math.min(amount, this.maxHp - this.hp);
                this.hp += healed;
                this.healFlash = healed; // 记录回复量，渲染层会取用
                return healed;
            }

            clearHealFlash() { this.healFlash = 0; }

            canAttack() {
                return this.attackCooldown <= 0 && !this.isDead;
            }

            applyHeroSkillBeforeAttack(target) {
                if (!target || target.isDead) return { extraDamage: 0, skillLog: null, cast: false };
                if ((this.maxMana || 100) > 0 && (this.mana || 0) < (this.maxMana || 100)) {
                    return { extraDamage: 0, skillLog: null, cast: false };
                }

                this.mana = 0;

                const spellBoost = 1 + (this.spellPower || 0) / 100;

                // ═══ 回复/护持系 ═══
                if (this.heroId === 'healer1' || this.heroId === 'dragon1' || this.heroId === 'epic_mage') {
                    const healRatio = this.heroId === 'dragon1' ? 0.22 : 0.12;
                    const healed = this.heal(this.maxHp * healRatio);
                    return { extraDamage: 0, skillLog: healed > 0 ? `💚 ${this.name} 施放回复 +${Math.floor(healed)}` : null, cast: true };
                }

                // ═══ 法术/远程系 ═══
                if (['mage1', 'mage2', 'huangfengguai', 'honghaier', 'mage_yinjiao', 'assassin2', 'donghailongwang', 'epic_healer'].includes(this.heroId)) {
                    const strongCaster = this.heroId === 'honghaier' || this.heroId === 'mage_yinjiao';
                    const extraDamage = this.atk * (strongCaster ? 0.65 : 0.45) * spellBoost;
                    if (this.heroId === 'huangfengguai' || this.heroId === 'epic_healer') {
                        target.atkSpeed = Math.max(0.35, (target.atkSpeed || 1) * 0.85);
                    }
                    return { extraDamage, skillLog: `✨ ${this.name} 释放法术强化`, cast: true };
                }

                // ═══ 守护/前排系 ═══
                if (this.heroId === 'tank1' || this.heroId === 'warrior1' || this.heroId === 'knight1') {
                    this.damageReduction = Math.min(70, this.damageReduction + 8);
                    const extraDamage = this.heroId === 'knight1' ? this.atk * 0.25 : 0;
                    return { extraDamage, skillLog: `🛡️ ${this.name} 提升护盾`, cast: true };
                }

                // ═══ 花果山爆发系 ═══
                if (['assassin1', 'huaguo_houjiang', 'liuer_mihou', 'legendary1'].includes(this.heroId)) {
                    this.critRate = Math.min(0.95, this.critRate + 0.08);
                    if (this.heroId === 'liuer_mihou' || this.heroId === 'legendary1') {
                        target._voidMark = (target._voidMark || 0) + 0.18;
                    }
                    return { extraDamage: this.atk * 0.25, skillLog: `🗡️ ${this.name} 进入猎杀号角`, cast: true };
                }

                // ═══ 土地公公：破甲 — 使敌人护甲降低5点（可叠3层） ═══
                if (this.heroId === 'archer2') {
                    if (!target._debuffCount) target._debuffCount = 0;
                    target._debuffCount = Math.min(3, (target._debuffCount || 0) + 1);
                    target.armor = Math.max(0, (target.armor || 0) - 5);
                    return { extraDamage: 0, skillLog: `🎯 ${this.name} 破甲！敌人-${5 * target._debuffCount}护甲`, cast: true };
                }

                // ═══ 镇元大仙：袖里乾坤 — 对目标造成减速debuff ═══
                if (this.heroId === 'knight2') {
                    if (!target._slowStacks) target._slowStacks = 0;
                    target._slowStacks = Math.min(3, (target._slowStacks || 0) + 1);
                    const slowFactor = 1 - target._slowStacks * 0.15;
                    target.atkSpeed = Math.max(0.3, (target.atkSpeed || 1) * slowFactor);
                    return { extraDamage: 0, skillLog: `❄️ ${this.name} 冰封！敌人攻速-${target._slowStacks * 15}%`, cast: true };
                }

                // ═══ 金角大王：低血量斩杀 ═══
                if (this.heroId === 'assassin_jinjiao') {
                    const extraDamage = target.hp < target.maxHp * 0.5 ? this.atk * 0.55 : this.atk * 0.2;
                    return { extraDamage, skillLog: `🗡️ ${this.name} 紫金葫芦`, cast: true };
                }

                // ═══ 猪悟能：九齿钉耙 ═══
                if (this.heroId === 'ranger2') {
                    return { extraDamage: this.atk * 0.45, skillLog: `💥 ${this.name} 九齿猛击！`, cast: true };
                }

                // ═══ 如来佛祖：佛掌镇压 — 全属性+10% ═══
                if (this.heroId === 'legendary2') {
                    this.atk = Math.floor(this.atk * 1.1);
                    this.maxHp = Math.floor(this.maxHp * 1.1);
                    this.hp = Math.floor(this.hp * 1.1);
                    this.atkSpeed *= 1.1;
                    return { extraDamage: 0, skillLog: `⭐ ${this.name} 天命制裁！属性+10%`, cast: true };
                }

                return { extraDamage: 0, skillLog: null, cast: false };
            }

            performAttack(target) {
                if (!target || target.isDead || this.isDead) {
                    return { damage: 0, crit: false, skillLog: null, cast: false };
                }
                this.attackCooldown = this.maxCooldown / this.atkSpeed;
                this.mana = Math.min(this.maxMana || 100, (this.mana || 0) + this.manaGainOnAttack);
                const skill = this.applyHeroSkillBeforeAttack(target);
                let damage = this.atk + (skill.extraDamage || 0);
                let isCrit = false;
                const critDmgMult = 1 + (this.critDmg || 150) / 100;
                if (Math.random() < this.critRate) {
                    damage *= critDmgMult;
                    isCrit = true;
                }
                const actualDamage = target.takeDamage(damage, this);

                // 妖族灼烧
                if (this.burnRate > 0) {
                    target.applyBurn(this.burnRate, 30);
                }

                // ═══ 法宝附加效果 ═══
                const log = skill.skillLog;

                // 伏妖令：对低于50%血的敌人+50%伤害
                if (this.executionBonus && target.hp < target.maxHp * 0.5) {
                    target.takeDamage(Math.floor(this.atk * this.executionBonus), this);
                }

                // 雷火珠：每次普攻额外伤害
                if (this.chainLightning) {
                    target.takeDamage(this.chainLightning, this);
                }

                // 破甲符：普攻减少目标护甲
                if (this.armorShred) {
                    target.armor = Math.max(0, (target.armor || 0) - this.armorShred);
                }

                // 甘露盏：普攻为最低血量友军回复
                if (this.healAlly && this.isPlayer && this.game) {
                    const allies = this.game.getBoardUnits().filter(u => u !== this && !u.isDead);
                    if (allies.length > 0) {
                        const lowest = allies.reduce((a, b) => a.hp / a.maxHp < b.hp / b.maxHp ? a : b);
                        lowest.heal(this.healAlly);
                    }
                }

                return { damage: actualDamage, crit: isCrit, skillLog: log, cast: !!skill.cast };
            }

            tick(speedMultiplier = 1) {
                if (!this.isDead) {
                    this.tickBurn(speedMultiplier);
                    if (this.attackCooldown > 0) this.attackCooldown -= speedMultiplier;
                    if (this.healRate > 0) this.heal(this.maxHp * this.healRate / 100 * speedMultiplier);
                }
            }
        }

            syncCanvasSize() {
                if (!this.canvas) return;
                this.canvas.width = CONFIG.BOARD_CANVAS_WIDTH || CONFIG.BOARD_WIDTH * CONFIG.CELL_SIZE;
                this.canvas.height = CONFIG.BOARD_CANVAS_HEIGHT || CONFIG.BOARD_HEIGHT * CONFIG.CELL_SIZE;
            }

            getBoardMetrics() {
                const hasArt = BOARD_BACKGROUND_IMAGE.complete && BOARD_BACKGROUND_IMAGE.naturalWidth > 0;
                const grid = hasArt ? CONFIG.BOARD_ART_GRID : { x: 0, y: 0, width: 1, height: 1 };
                const x = this.canvas.width * grid.x;
                const y = this.canvas.height * grid.y;
                const width = this.canvas.width * grid.width;
                const height = this.canvas.height * grid.height;
                const quad = this.getBoardQuad({ x, y, width, height });
                return {
                    x,
                    y,
                    width,
                    height,
                    cellW: width / CONFIG.BOARD_WIDTH,
                    cellH: height / CONFIG.BOARD_HEIGHT,
                    quad
                };
            }

            getBoardQuad(rect = null) {
                const fallback = rect || {
                    x: 0,
                    y: 0,
                    width: this.canvas.width,
                    height: this.canvas.height
                };
                const q = CONFIG.BOARD_QUAD;
                if (!q || !q.topLeft || !q.topRight || !q.bottomLeft || !q.bottomRight) {
                    return {
                        topLeft: { x: fallback.x, y: fallback.y },
                        topRight: { x: fallback.x + fallback.width, y: fallback.y },
                        bottomLeft: { x: fallback.x, y: fallback.y + fallback.height },
                        bottomRight: { x: fallback.x + fallback.width, y: fallback.y + fallback.height }
                    };
                }

                const scaleX = this.canvas.width / (CONFIG.BOARD_CANVAS_WIDTH || this.canvas.width || 1);
                const scaleY = this.canvas.height / (CONFIG.BOARD_CANVAS_HEIGHT || this.canvas.height || 1);
                return {
                    topLeft: { x: q.topLeft.x * scaleX, y: q.topLeft.y * scaleY },
                    topRight: { x: q.topRight.x * scaleX, y: q.topRight.y * scaleY },
                    bottomLeft: { x: q.bottomLeft.x * scaleX, y: q.bottomLeft.y * scaleY },
                    bottomRight: { x: q.bottomRight.x * scaleX, y: q.bottomRight.y * scaleY }
                };
            }

            lerpPoint(a, b, t) {
                return {
                    x: a.x + (b.x - a.x) * t,
                    y: a.y + (b.y - a.y) * t
                };
            }

            pointOnBoardQuad(u, v) {
                const q = this.getBoardMetrics().quad;
                const top = this.lerpPoint(q.topLeft, q.topRight, u);
                const bottom = this.lerpPoint(q.bottomLeft, q.bottomRight, u);
                return this.lerpPoint(top, bottom, v);
            }

            getBoardRowRatios() {
                const expected = CONFIG.BOARD_HEIGHT + 1;
                const input = Array.isArray(CONFIG.BOARD_ROW_RATIOS) ? CONFIG.BOARD_ROW_RATIOS : [];
                const ratios = [];
                for (let i = 0; i < expected; i++) {
                    const fallback = i / CONFIG.BOARD_HEIGHT;
                    const value = Number.isFinite(input[i]) ? input[i] : fallback;
                    ratios.push(Math.max(0, Math.min(1, value)));
                }
                ratios[0] = 0;
                ratios[expected - 1] = 1;
                for (let i = 1; i < expected - 1; i++) {
                    const min = ratios[i - 1] + 0.01;
                    const max = 1 - (expected - 1 - i) * 0.01;
                    ratios[i] = Math.max(min, Math.min(max, ratios[i]));
                }
                return ratios;
            }

            getCellQuad(row, col) {
                const q = this.getBoardMetrics().quad;
                const rowRatios = this.getBoardRowRatios();
                const u0 = col / CONFIG.BOARD_WIDTH;
                const u1 = (col + 1) / CONFIG.BOARD_WIDTH;
                const v0 = rowRatios[row] ?? row / CONFIG.BOARD_HEIGHT;
                const v1 = rowRatios[row + 1] ?? (row + 1) / CONFIG.BOARD_HEIGHT;
                const interp = (u, v) => {
                    const top = this.lerpPoint(q.topLeft, q.topRight, u);
                    const bottom = this.lerpPoint(q.bottomLeft, q.bottomRight, u);
                    return this.lerpPoint(top, bottom, v);
                };
                return {
                    tl: interp(u0, v0),
                    tr: interp(u1, v0),
                    br: interp(u1, v1),
                    bl: interp(u0, v1)
                };
            }

            getQuadBounds(quad) {
                const points = [quad.tl, quad.tr, quad.br, quad.bl];
                const xs = points.map(p => p.x);
                const ys = points.map(p => p.y);
                const x = Math.min(...xs);
                const y = Math.min(...ys);
                return {
                    x,
                    y,
                    w: Math.max(...xs) - x,
                    h: Math.max(...ys) - y
                };
            }

            getCellRenderBox(row, col) {
                const quad = this.getCellQuad(row, col);
                const center = this.getCellCenter(row, col);
                const topW = Math.hypot(quad.tr.x - quad.tl.x, quad.tr.y - quad.tl.y);
                const bottomW = Math.hypot(quad.br.x - quad.bl.x, quad.br.y - quad.bl.y);
                const leftH = Math.hypot(quad.bl.x - quad.tl.x, quad.bl.y - quad.tl.y);
                const rightH = Math.hypot(quad.br.x - quad.tr.x, quad.br.y - quad.tr.y);
                const width = (topW + bottomW) / 2;
                const height = (leftH + rightH) / 2;
                return { center, width, height, quad };
            }

            getCellRect(row, col) {
                const quad = this.getCellQuad(row, col);
                const bounds = this.getQuadBounds(quad);
                return { ...bounds, quad };
            }

            getCellCenter(row, col) {
                const q = this.getBoardMetrics().quad;
                const rowRatios = this.getBoardRowRatios();
                const u = (col + 0.5) / CONFIG.BOARD_WIDTH;
                const v0 = rowRatios[row] ?? row / CONFIG.BOARD_HEIGHT;
                const v1 = rowRatios[row + 1] ?? (row + 1) / CONFIG.BOARD_HEIGHT;
                const v = (v0 + v1) / 2;
                const top = this.lerpPoint(q.topLeft, q.topRight, u);
                const bottom = this.lerpPoint(q.bottomLeft, q.bottomRight, u);
                return this.lerpPoint(top, bottom, v);
            }

            getCellFromCanvasPoint(x, y) {
                for (let row = 0; row < CONFIG.BOARD_HEIGHT; row++) {
                    for (let col = 0; col < CONFIG.BOARD_WIDTH; col++) {
                        const quad = this.getCellQuad(row, col);
                        if (this.pointInQuad({ x, y }, quad)) return { row, col };
                    }
                }
                return null;
            }

            pointInQuad(point, quad) {
                const pts = [quad.tl, quad.tr, quad.br, quad.bl];
                let inside = false;
                for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                    const pi = pts[i];
                    const pj = pts[j];
                    const intersects = ((pi.y > point.y) !== (pj.y > point.y)) &&
                        (point.x < (pj.x - pi.x) * (point.y - pi.y) / ((pj.y - pi.y) || 1e-6) + pi.x);
                    if (intersects) inside = !inside;
                }
                return inside;
            }

            traceCellQuad(ctx, quad, inset = 0) {
                const center = {
                    x: (quad.tl.x + quad.tr.x + quad.br.x + quad.bl.x) / 4,
                    y: (quad.tl.y + quad.tr.y + quad.br.y + quad.bl.y) / 4
                };
                const shrink = (p) => inset <= 0
                    ? p
                    : { x: p.x + (center.x - p.x) * inset, y: p.y + (center.y - p.y) * inset };
                ctx.beginPath();
                ctx.moveTo(shrink(quad.tl).x, shrink(quad.tl).y);
                ctx.lineTo(shrink(quad.tr).x, shrink(quad.tr).y);
                ctx.lineTo(shrink(quad.br).x, shrink(quad.br).y);
                ctx.lineTo(shrink(quad.bl).x, shrink(quad.bl).y);
                ctx.closePath();
            }

            drawCellCornerMarkers(ctx, quad, color, alpha = 0.75, inset = 0.14, lengthRatio = 0.24) {
                const center = {
                    x: (quad.tl.x + quad.tr.x + quad.br.x + quad.bl.x) / 4,
                    y: (quad.tl.y + quad.tr.y + quad.br.y + quad.bl.y) / 4
                };
                const shrink = (p) => ({ x: p.x + (center.x - p.x) * inset, y: p.y + (center.y - p.y) * inset });
                const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
                const points = [shrink(quad.tl), shrink(quad.tr), shrink(quad.br), shrink(quad.bl)];

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                for (let i = 0; i < points.length; i++) {
                    const corner = points[i];
                    const prev = points[(i + points.length - 1) % points.length];
                    const next = points[(i + 1) % points.length];
                    const p1 = lerp(corner, prev, lengthRatio);
                    const p2 = lerp(corner, next, lengthRatio);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(corner.x, corner.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawCellOverlayImage(ctx, quad, img, alpha = 0.72, inset = 0.10) {
                if (!img || !img.complete || img.naturalWidth <= 0) return false;
                const center = {
                    x: (quad.tl.x + quad.tr.x + quad.br.x + quad.bl.x) / 4,
                    y: (quad.tl.y + quad.tr.y + quad.br.y + quad.bl.y) / 4
                };
                const shrink = (p) => inset <= 0
                    ? p
                    : { x: p.x + (center.x - p.x) * inset, y: p.y + (center.y - p.y) * inset };
                const points = [shrink(quad.tl), shrink(quad.tr), shrink(quad.br), shrink(quad.bl)];
                const xs = points.map(p => p.x);
                const ys = points.map(p => p.y);
                const x = Math.min(...xs);
                const y = Math.min(...ys);
                const w = Math.max(...xs) - x;
                const h = Math.max(...ys) - y;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath();
